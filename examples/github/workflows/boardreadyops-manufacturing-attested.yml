# COPY into the target repository as .github/workflows/boardreadyops-manufacturing-attested.yml.
# Replace the explicit BoardReadyOps Action SHA placeholder with a reviewed
# immutable commit containing the export action, and set the project path.
# Commit the workflow + build/boardreadyops-attested/ ignore rule on a protected
# branch BEFORE invoking workflow_dispatch. Never trigger on pull_request.
name: BoardReadyOps reviewed fabrication attestation
on:
  workflow_dispatch:

permissions: {}

jobs:
  attest-manufacturing-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout the exact reviewed source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and check KiCad 10
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install --yes kicad
          [[ "$(kicad-cli version)" == 10.0.* ]]
      - name: Generate reviewed Gerber/Excellon bytes and subject inventory
        id: export
        # Deliberately non-runnable until the owner pins the reviewed source
        # commit containing this Action. No mutable main/tag allowed.
        uses: oaslananka/boardreadyops/.github/actions/manufacturing-attested-export@REPLACE_WITH_REVIEWED_40_CHAR_COMMIT_SHA
        with:
          reviewed-source-sha: ${{ github.sha }}
          project: hardware/board.kicad_pro # REPLACE with a real tracked project
      - name: Sign the exact output set with this target repository's GitHub OIDC
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ steps.export.outputs.subject-checksums }}
      - name: Keep the exact generated bytes and manifest inside the target repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-manufacturing-export
          path: ${{ steps.export.outputs.export-directory }}/
          if-no-files-found: error
          retention-days: 7
