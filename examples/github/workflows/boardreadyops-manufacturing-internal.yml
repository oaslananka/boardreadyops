# Optional target-repository template: GitHub-internal Sigstore, no GitHub Attestations API write.
# GitHub Free private repos cannot enforce branch protection, so strict reviewed
# source authority remains FAIL CLOSED until independently authorized.
# COPY to the target repository as .github/workflows/boardreadyops-manufacturing-internal.yml.
# The full Action SHA is a reviewed, protected-merge example; verify/update it before adopting.
# Before adoption, independently review the approved protected-merge
# commit SHA containing the export action and the tracked project path.
# Commit the workflow + build/boardreadyops-attested/ ignore rule on a protected
# branch BEFORE invoking workflow_dispatch. Never trigger on pull_request.
name: BoardReadyOps reviewed fabrication offline attestation
on:
  workflow_dispatch:

permissions: {}

jobs:
  attest-manufacturing-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact reviewed source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and check KiCad 10
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install --yes kicad
          [[ "$(kicad-cli version)" == 10.0.* ]]
      - name: Generate reviewed Gerber/Excellon bytes and subject inventory
        id: export
        # Immutable reviewed protected-merge SHA shown for this test target.
        # Verify the pin matches the intended BoardReadyOps Action contents.
        uses: oaslananka/boardreadyops/.github/actions/manufacturing-attested-export@8ff9d9b5cdc537fe1eaa00afee4f2d8325044e85
        with:
          reviewed-source-sha: ${{ github.sha }}
          project: hardware/board.kicad_pro # REPLACE with a real tracked project
      - name: Install GitHub official attestation library
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/attest-tools" --no-audit --no-fund --ignore-scripts --save-exact @actions/attest@3.2.0
      - name: Sign full export inventory with GitHub-internal Sigstore (no API storage)
        id: internal
        shell: bash
        env:
          SUBJECTS: ${{ steps.export.outputs.subject-checksums }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${{ github.ref_protected }}" == "true" ]]
          [[ "${{ github.event.repository.fork }}" == "false" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          cat > "$RUNNER_TEMP/attest-tools/sign.mjs" <<'JSCODE'
          import fs from 'node:fs';
          import {attestProvenance} from '@actions/attest';
          const pattern=/^([a-f0-9]{64})  ([a-zA-Z0-9_.\/-]+)$/u;
          const lines=fs.readFileSync(process.env.SUBJECTS,'utf8').trimEnd().split('\n');
          const names=new Set();
          const subjects=lines.map(line=>{
            const m=pattern.exec(line);
            if(!m || names.has(m[2]) || m[2].split('/').some(x=>x===''||x==='.'||x==='..')) throw new Error('Unsafe subject checksum list');
            names.add(m[2]);
            return {name:m[2],digest:{sha256:m[1]}};
          });
          if(subjects.length<3 || !subjects.some(x=>x.name.endsWith('/manifest.json'))) throw new Error('Incomplete export');
          const result=await attestProvenance({
            subjects,
            token:process.env.GH_TOKEN,
            sigstore:'github',
            skipWrite:true,
          });
          if(result.attestationID||result.tlogID) throw new Error('Unexpected remote persistence');
          const bundle=process.env.RUNNER_TEMP+'/boardreadyops-internal-export.sigstore.json';
          fs.writeFileSync(bundle,JSON.stringify(result.bundle));
          const verify=JSON.parse(fs.readFileSync(bundle,'utf8'));
          if((verify?.verificationMaterial?.tlogEntries??[]).length!==0) throw new Error('Unexpected public transparency log entry');
          if((verify?.verificationMaterial?.timestampVerificationData?.rfc3161Timestamps??[]).length===0) throw new Error('No signed internal timestamp');
          console.log('GitHub-internal signed SLSA bundle created for '+subjects.length+' artifacts (no API storage).');
          JSCODE
          node "$RUNNER_TEMP/attest-tools/sign.mjs"
      - name: Retain signed bundle in the target repository Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-manufacturing-internal-attestation
          path: ${{ runner.temp }}/boardreadyops-internal-export.sigstore.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep the exact generated bytes and manifest inside the target repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-manufacturing-export
          path: ${{ steps.export.outputs.export-directory }}/
          if-no-files-found: error
          retention-days: 7
