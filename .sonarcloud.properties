# SonarQube Cloud Automatic Analysis is the authoritative Sonar execution mode.
# Do not add a CI scanner while Automatic Analysis is enabled in the SonarQube Cloud project.
# Generated output, dependency trees, tests, and migration snapshots are excluded from main-code analysis.
sonar.exclusions=dist/**,coverage/**,tests/**,apps/web/.next/**,**/node_modules/**,packages/db/prisma/migrations/**,packages/db/migrations/**
# Duplication analysis is about source, and these two are generated output.
#   packages/db/migrations/** -- SQL migrations repeat their guard and index idioms by nature.
#   docs/rules/** -- every file here is written by scripts/generate-rule-docs.mjs from one
#     template, so 44 rule pages share their frontmatter keys, section headings and config
#     scaffold: 51% of their non-blank lines are identical across pages. That repetition is the
#     point of a reference -- de-duplicating it would mean one page with 44 sections -- and the
#     template itself exists once, in the generator. rule-docs-coverage.test.ts is what actually
#     guards these files.
sonar.cpd.exclusions=packages/db/migrations/**,docs/rules/**
