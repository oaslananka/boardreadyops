version: 1
mode: enforce
releaseMode: prototype
projects:
  - path: .
fail-on: high
rules:
  bom.missing-mpn: true
  bom.compliance: true
  bom.lifecycle: true
  bom.risk-score: true
  bom.eol-detection: true
  bom.unknown-lifecycle: true
  bom.single-source: false
  design.board-outline: true
  design.unique-references: true
  drc.kicad: true
  manufacturing.package-completeness: false
  manufacturing.fab-notes: false
  manufacturing.position-coverage: false
  manufacturing.drill-coverage: false
  release.revision-set: true
  release.changelog-present: false
  release.tag-matches-revision: false
report:
  sarif: boardreadyops.sarif.json
  json: boardreadyops.findings.json
  markdown: boardreadyops.report.md
  html: boardreadyops.report.html
