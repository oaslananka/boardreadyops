node:
  minimum: "24"
  minimumVersion: "24.0.0"
  recommended: "24"
  supported: ["24"]
  current: []
  ltsPending: ["26"]
  upstreamLatest:
    "24": "24.22.2"
    "26": "26.13.0"
  tested:
    "24": "24.22.1"
  policy:
    "24": "Maintenance LTS and recommended runtime. Used by default CI jobs, binary builds, GitHub Action runtime, and KiCad 10.0 integration jobs."
    "26": "Upstream LTS since October 2026; not supported until dependency/toolchain and cross-platform CI validation. Keep Node 24 as the only supported major."
cyclonedx:
  specVersion: "1.7"
  schemaUrl: "https://cyclonedx.org/schema/bom-1.7.schema.json"
  hbomSchema: "schemas/hbom.schema.json"
  validation: "schemas/hbom.schema.json pins $schema and specVersion; tests/unit/report/hbom.test.ts validates generated HBOM with AJV; CI runs unit tests and verify:dist."
