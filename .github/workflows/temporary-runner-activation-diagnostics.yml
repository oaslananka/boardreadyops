name: temporary-runner-activation-format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.repository_owner == 'oaslananka' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Format activation files
        shell: bash
        run: |
          pnpm exec biome check --write \
            packages/contracts/src/runner-protocol.ts \
            tests/unit/contracts/runner-protocol.test.ts \
            apps/web/lib/runner-registration-activation-route.ts \
            apps/web/app/api/v1/runner/registrations/activate/route.ts \
            tests/unit/web/runner-registration-activation-route.test.ts
          pnpm run typecheck
          pnpm exec vitest run \
            tests/unit/contracts/runner-protocol.test.ts \
            tests/unit/web/runner-registration-activation-route.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/runner-protocol.ts \
            tests/unit/contracts/runner-protocol.test.ts \
            apps/web/lib/runner-registration-activation-route.ts \
            apps/web/app/api/v1/runner/registrations/activate/route.ts \
            tests/unit/web/runner-registration-activation-route.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format runner activation files"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
