name: release-node22-diagnostic

on:
  pull_request:
  push:
    branches:
      - diagnostic/release-node22-20260713

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://boardreadyops@127.0.0.1:5432/boardreadyops_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boardreadyops
          POSTGRES_DB: boardreadyops_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardreadyops -d boardreadyops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - name: Install KiCad 10.0
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes "ppa:kicad/kicad-10.0-releases"
          sudo apt-get update -qq
          sudo apt-get install --yes kicad
          version="$(kicad-cli version)"
          echo "kicad-cli ${version}"
          [[ "${version}" == 10.0.* ]]
      - run: pnpm install --frozen-lockfile
      - name: Apply cloud migrations
        run: pnpm --filter @boardreadyops/db db:migrate
      - name: Run integration suite and capture full output
        shell: bash
        run: |
          set +e
          pnpm exec vitest run tests/integration --reporter=verbose --no-color 2>&1 | tee release-node22-integration.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "${status}" > release-node22-integration.exit
          exit 0
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-node22-integration-diagnostic
          path: |
            release-node22-integration.log
            release-node22-integration.exit
      - name: Preserve failing status
        run: exit "$(cat release-node22-integration.exit)"
