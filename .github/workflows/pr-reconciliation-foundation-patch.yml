name: reconciliation-foundation-patch

on:
  push:
    branches:
      - cloud/reconciliation-operations-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: cloud/reconciliation-operations-foundation
      - name: Apply patch
        run: python3 scripts/patch-reconciliation-foundation.py
      - name: Remove temporary patch files
        run: rm scripts/patch-reconciliation-foundation.py .github/workflows/pr-reconciliation-foundation-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(db): harden reconciliation operations foundation"
          git push origin HEAD:cloud/reconciliation-operations-foundation
