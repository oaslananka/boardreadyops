name: cloud-deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only on the production host; no container replacement, migrations, canary, or health check. Checkout/images/cache may change.
        required: false
        default: true
        type: boolean
      retire_superseded_images:
        description: On low disk only, reclaim old runtime images if a previous successfully deployed rollback image is already pinned.
        required: false
        default: false
        type: boolean

concurrency:
  group: cloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Load SSH key from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/cloud-deploy-key"
          doppler secrets get CLOUD_DEPLOY_SSH_PRIVATE_KEY --plain \
            --project boardreadyops --config deploy > "${key_path}"
          chmod 600 "${key_path}"
          echo "CLOUD_DEPLOY_SSH_KEY_PATH=${key_path}" >> "$GITHUB_ENV"

      - name: Load Tailscale OAuth credentials from Doppler
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");

            function readDeploySecret(name) {
              return execFileSync(
                "doppler",
                ["secrets", "get", name, "--plain", "--project", "boardreadyops", "--config", "deploy"],
                { encoding: "utf8" },
              ).trim();
            }

            const clientId = readDeploySecret("TAILSCALE_OAUTH_CLIENT_ID");
            const clientSecret = readDeploySecret("TAILSCALE_OAUTH_CLIENT_SECRET");

            // core.setSecret masks the value in log output; core.exportVariable makes it
            // available to later steps via the env context, which is what the Tailscale
            // action's `with:` block below needs. Doing the fetch-and-mask in one script
            // step, rather than a shell `echo`, keeps the value out of any workflow-command
            // text a later step could otherwise interfere with.
            core.setSecret(clientId);
            core.setSecret(clientSecret);
            core.exportVariable("TAILSCALE_OAUTH_CLIENT_ID", clientId);
            core.exportVariable("TAILSCALE_OAUTH_CLIENT_SECRET", clientSecret);

      - name: Connect Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-deploy
          version: 1.94.2

      - name: Run production deploy runbook
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # deploy.sh has no rehearsal mode of its own, so dry_run maps to its own
          # documented `build`-only usage (builds the image, touches no running
          # container) instead of the real `up -d --build` (replaces web/worker/migrate).
          DEPLOY_ARGS: ${{ inputs.dry_run && 'build migrate web worker' || 'up -d --build migrate web worker' }}
          RETIRE_SUPERSEDED_IMAGES: ${{ inputs.retire_superseded_images && '1' || '0' }}
        run: |
          set -euo pipefail
          # Fetched fresh here instead of exported via an earlier step: this value is only
          # ever used in this one step, so it can stay a local shell variable and never
          # needs to cross through $GITHUB_ENV or be masked at all.
          ssh_host="$(doppler secrets get CLOUD_DEPLOY_SSH_HOST --plain \
            --project boardreadyops --config deploy)"
          ssh -i "${CLOUD_DEPLOY_SSH_KEY_PATH}" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "ubuntu@${ssh_host}" \
            "bash -s -- '${DEPLOY_ARGS}' '${RETIRE_SUPERSEDED_IMAGES}'" <<'REMOTE_DEPLOY'
          set -euo pipefail
          deploy_root=/home/ubuntu/boardreadyops-cloud
          repo_dir="${deploy_root}/repo"
          legacy_policy_file="/opt/boardreadyops-cloud/release-repositories"
          migrated_policy_file="${deploy_root}/release-repositories"
          policy_file=""
          policy_override_file="${deploy_root}/compose.release-policy.yml"
          container_policy_path="/run/policies/repositories"
          deploy_args="$1"
          retire_superseded_images="$2"

          test -d "${repo_dir}/.git" || {
            printf '%s\n' 'cloud-deploy preflight: deployment checkout is not commissioned; follow docs/deployment/self-hosted.md before retrying' >&2
            exit 78
          }
          test -x "${deploy_root}/deploy.sh" || {
            printf '%s\n' 'cloud-deploy preflight: deployment runbook is not commissioned; follow docs/deployment/self-hosted.md before retrying' >&2
            exit 78
          }

          if [ -e "${policy_override_file}" ]; then
            test -f "${policy_override_file}" && test ! -L "${policy_override_file}" || {
              printf '%s\n' 'cloud-deploy preflight: release-policy override is not a regular file' >&2
              exit 78
            }
            # Read the exact override instead of guessing from staged file existence.
            old_bindings="$(grep -Fc -- "${legacy_policy_file}:${container_policy_path}:ro" "${policy_override_file}" || true)"
            new_bindings="$(grep -Fc -- "${migrated_policy_file}:${container_policy_path}:ro" "${policy_override_file}" || true)"
            case "${old_bindings}:${new_bindings}" in
              2:0) policy_file="${legacy_policy_file}" ;;
              0:2) policy_file="${migrated_policy_file}" ;;
              *) printf '%s\n' 'cloud-deploy preflight: release-policy override has ambiguous or unsupported policy mounts' >&2; exit 78 ;;
            esac
            test -f "${policy_file}" && test ! -L "${policy_file}" || {
              printf '%s\n' 'cloud-deploy preflight: release-policy override exists but the policy file is missing or invalid' >&2
              exit 78
            }
          fi

          run_deploy() {
            if [ -f "${policy_override_file}" ]; then
              ./deploy.sh -f "${policy_override_file}" "$@"
            else
              ./deploy.sh "$@"
            fi
          }

          container_for_service() {
            local service="$1"
            local ids
            local count
            ids="$(
              docker ps \
                --filter 'label=com.docker.compose.project=boardreadyops-cloud' \
                --filter "label=com.docker.compose.service=${service}" \
                --format '{{.ID}}'
            )"
            count="$(printf '%s\n' "${ids}" | awk 'NF { count += 1 } END { print count + 0 }')"
            test "${count}" = "1" || {
              printf 'cloud-deploy policy: expected exactly one running %s container, found %s\n' \
                "${service}" "${count}" >&2
              return 78
            }
            printf '%s\n' "${ids}" | awk 'NF { print; exit }'
          }

          verify_release_policy_mount() {
            local service
            local container
            local configured_file
            local mount_source
            [ -f "${policy_override_file}" ] || return 0

            for service in web worker; do
              container="$(container_for_service "${service}")"
              test -n "${container}" || {
                printf 'cloud-deploy policy: %s container is missing after deploy\n' "${service}" >&2
                return 78
              }
              configured_file="$(
                docker inspect "${container}" --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  | awk -F= '$1 == "BOARDREADYOPS_RELEASE_REPOSITORIES_FILE" {sub(/^[^=]*=/, ""); print; exit}'
              )"
              mount_source="$(
                docker inspect "${container}" --format '{{range .Mounts}}{{printf "%s|%s\n" .Source .Destination}}{{end}}' \
                  | awk -F'|' -v destination="${container_policy_path}" '$2 == destination {print $1; exit}'
              )"
              test "${configured_file}" = "${container_policy_path}" \
                && test "${mount_source}" = "${policy_file}" || {
                  printf 'cloud-deploy policy: %s is missing the commissioned release-policy mount\n' "${service}" >&2
                  return 78
                }
            done
          }

          # Disk preflight. Building the runtime image needs room for the new layers and for
          # exporting them, and every deploy leaves another `boardreadyops-web-runtime:<sha>`
          # behind. When the host fills up, `docker compose build` fails only after the image is
          # already built -- the run reads as a build failure ("no space left on device" writing a
          # metadata file) minutes in, with nothing about disk in the workflow to point at.
          #
          # So: report the space, reclaim only what is safe to reclaim, and fail early and
          # specifically if it is still not enough.
          # Use the freshly verified helper even for the opt-in low-disk preflight.
          cd "${repo_dir}"
          git fetch origin --prune
          git checkout main
          git reset --hard origin/main
          cd "${deploy_root}"

          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || printf '/var/lib/docker')"
          free_mib() { df -Pm "$1" | awk 'NR==2 {print $4}'; }
          required_mib=12288
          build_cache_max_used_space=3GB
          reclaim_build_cache_for_preflight() {
            docker builder prune --all --force || true
          }
          trim_build_cache() {
            if ! docker buildx prune --all --force --max-used-space "${build_cache_max_used_space}"; then
              printf 'cloud-deploy cache: unable to enforce %s cache budget; investigate host capacity after deploy\n' "${build_cache_max_used_space}" >&2
              return 1
            fi
          }
          report_disk_summary() {
            local runtime_image_ids
            local runtime_image_count=0
            local runtime_image_bytes=0
            local runtime_image_mib=0
            local image_id
            local image_size

            printf '%s\n' 'cloud-deploy disk: docker system summary'
            docker system df || true

            runtime_image_ids="$(
              docker image ls 'boardreadyops-web-runtime:*' --format '{{.ID}}' 2>/dev/null | sort -u
            )"
            if [ -n "${runtime_image_ids}" ]; then
              while IFS= read -r image_id; do
                [ -n "${image_id}" ] || continue
                image_size="$(docker image inspect "${image_id}" --format '{{.Size}}' 2>/dev/null || printf '0')"
                case "${image_size}" in
                  ''|*[!0-9]*) image_size=0 ;;
                esac
                runtime_image_count=$((runtime_image_count + 1))
                runtime_image_bytes=$((runtime_image_bytes + image_size))
              done <<< "${runtime_image_ids}"
            fi
            runtime_image_mib=$(((runtime_image_bytes + 1048575) / 1048576))
            printf 'cloud-deploy disk: runtime images count=%s total_mib=%s\n' \
              "${runtime_image_count}" "${runtime_image_mib}"
          }

          available_mib="$(free_mib "${docker_root}")"
          printf 'cloud-deploy preflight: %s MiB free on %s (want >= %s MiB)\n' \
            "${available_mib}" "${docker_root}" "${required_mib}"

          if [ "${available_mib}" -lt "${required_mib}" ]; then
            # BuildKit cache is disposable. When the host is already below the safe build floor,
            # reclaim all of it before considering tagged rollback images. After a successful
            # build, trim_build_cache restores the normal bounded 3 GB cache policy.
            printf '%s\n' 'cloud-deploy preflight: below threshold, fully reclaiming build cache and dangling layers'
            reclaim_build_cache_for_preflight
            docker image prune --force || true
            available_mib="$(free_mib "${docker_root}")"
            printf 'cloud-deploy preflight: %s MiB free after reclaim\n' "${available_mib}"
          fi

          if [ "${available_mib}" -lt "${required_mib}" ]; then
            if [ "${retire_superseded_images}" = "1" ]; then
              printf '%s\n' 'cloud-deploy preflight: operator opted in to bounded superseded-runtime retirement'
              "${repo_dir}/scripts/cloud-runtime-image-retention.sh" retire --apply
              available_mib="$(free_mib "${docker_root}")"
              printf 'cloud-deploy preflight: %s MiB free after bounded runtime-image retirement\n' "${available_mib}"
            else
              printf '%s\n' 'cloud-deploy preflight: tagged runtime-image retirement is disabled; rerun with retire_superseded_images=true after reviewing the rollback policy'
            fi
          fi

          if [ "${available_mib}" -lt "${required_mib}" ]; then
            report_disk_summary
            if [ "${retire_superseded_images}" = "1" ]; then
              printf '%s\n' \
                "cloud-deploy preflight: only ${available_mib} MiB free on ${docker_root}, need ${required_mib} MiB after bounded runtime-image retirement." \
                'The current and explicitly pinned verified rollback images were preserved; remaining space' \
                'is held by retained images, volumes or logs and needs a separate operator decision.' >&2
            else
              printf '%s\n' \
                "cloud-deploy preflight: only ${available_mib} MiB free on ${docker_root}, need ${required_mib} MiB." \
                'Build cache and dangling layers have already been reclaimed. Tagged runtime images' \
                'remain untouched because rollback retirement requires explicit operator opt-in;' \
                'otherwise volumes or logs need a separate operator decision.' >&2
            fi
            exit 78
          fi

          case "${deploy_args}" in
            "build migrate web worker")
              run_deploy build migrate web worker
              ;;
            "up -d --build migrate web worker")
              # Verify the old running web + worker health and pin that exact image
              # before compose can replace either container. If deployment or browser
              # smoke fails, do not delete any image from this attempt.
              "${repo_dir}/scripts/cloud-runtime-image-retention.sh" pin "$(git -C "${repo_dir}" rev-parse HEAD)"
              run_deploy up -d --build migrate web worker
              verify_release_policy_mount

              ;;
            *)
              printf '%s\n' 'cloud-deploy preflight: unexpected deploy argument set' >&2
              exit 64
              ;;
          esac

          # Both rehearsal and real deploy paths build on the production host. Keep a bounded
          # amount of reusable BuildKit state after every successful build so a sequence of
          # dry-runs cannot refill a small host between disk preflights.
          printf 'cloud-deploy cache: capping BuildKit cache at %s\n' "${build_cache_max_used_space}"
          if ! trim_build_cache; then
            report_disk_summary
            exit 78
          fi
          printf 'cloud-deploy cache: %s MiB free after cache cap\n' "$(free_mib "${docker_root}")"
          # Image retirement happens only after the separate external browser smoke
          # passes. A rehearsal cannot validate a new image; it never retires one.
          # Report bounded aggregate usage after every rehearsal or real deployment,
          # not only when a preflight is already out of space. No other Docker
          # projects, rollback volumes, or private per-container metadata are altered.
          report_disk_summary
          REMOTE_DEPLOY

      - name: Verify production browser security headers
        if: ${{ !inputs.dry_run }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          public_origin="$(doppler secrets get BOARDREADYOPS_PUBLIC_URL --plain \
            --project boardreadyops --config deploy)"
          case "${public_origin}" in
            https://*) ;;
            *)
              printf '%s\n' 'cloud-deploy security smoke: BOARDREADYOPS_PUBLIC_URL must be HTTPS' >&2
              exit 78
              ;;
          esac
          public_origin="${public_origin%/}"

          require_header_directives() {
            local headers="$1"
            local name="$2"
            local path="$3"
            shift 3

            local actual
            actual="$(
              printf '%s\n' "${headers}" \
                | awk -v name="${name}" 'index(tolower($0), tolower(name ":")) == 1 { print; exit }'
            )"
            if [[ -z "${actual}" ]]; then
              printf 'cloud-deploy security smoke: %s missing on %s\n' "${name}" "${path}" >&2
              return 1
            fi

            local required
            for required in "$@"; do
              if ! printf '%s\n' "${actual}" | grep -Fiq -- "${required}"; then
                printf 'cloud-deploy security smoke: %s missing required directive %s on %s\n' \
                  "${name}" "${required}" "${path}" >&2
                return 1
              fi
            done
          }

          for path in / /dashboard; do
            headers="$(
              curl --fail --silent --show-error --max-time 20 \
                --dump-header - --output /dev/null "${public_origin}${path}" \
                | tr -d '\r'
            )"
            require_header_directives "${headers}" "Content-Security-Policy" "${path}" \
              "frame-ancestors 'none'" "base-uri 'self'" "object-src 'none'"
            require_header_directives "${headers}" "Strict-Transport-Security" "${path}" "max-age=31536000"
            require_header_directives "${headers}" "X-Content-Type-Options" "${path}" "nosniff"
            require_header_directives "${headers}" "Referrer-Policy" "${path}" "strict-origin-when-cross-origin"
            require_header_directives "${headers}" "Permissions-Policy" "${path}" \
              "camera=()" "geolocation=()" "microphone=()" "usb=()"
            require_header_directives "${headers}" "X-Frame-Options" "${path}" "DENY"
          done

      - name: Retire superseded runtime images after successful browser smoke
        if: ${{ !inputs.dry_run }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          ssh_host="$(doppler secrets get CLOUD_DEPLOY_SSH_HOST --plain \
            --project boardreadyops --config deploy)"
          ssh -i "${CLOUD_DEPLOY_SSH_KEY_PATH}" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "ubuntu@${ssh_host}" \
            '/home/ubuntu/boardreadyops-cloud/repo/scripts/cloud-runtime-image-retention.sh confirm "$(git -C /home/ubuntu/boardreadyops-cloud/repo rev-parse HEAD)" && /home/ubuntu/boardreadyops-cloud/repo/scripts/cloud-runtime-image-retention.sh retire --apply --allow-unchanged'

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "${CLOUD_DEPLOY_SSH_KEY_PATH}"
