name: producer-format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    name: producer-format / apply
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Apply Biome output
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm exec biome format --write \
            packages/cloud-core/package.json \
            packages/cloud-core/src/durable-lifecycle-planner.ts \
            packages/db/package.json \
            packages/db/src/transactional-lifecycle-store.ts \
            tests/integration/transactional-release-run-outbox-postgres.test.ts \
            tests/unit/cloud-core/durable-lifecycle-planner.test.ts \
            tests/unit/db/transactional-release-run-store.test.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cloud-core packages/db/package.json packages/db/src/transactional-lifecycle-store.ts tests
          git commit -m "style: format transactional outbox producer"
          git push origin "HEAD:${HEAD_REF}"
