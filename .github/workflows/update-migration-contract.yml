name: update-migration-contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    name: update-migration-contract / apply
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update deterministic migration assertions
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/db/migrations.test.ts')
          text = path.read_text()
          text = text.replace('expect(cloudDatabaseSchemaVersion).toBe(16);', 'expect(cloudDatabaseSchemaVersion).toBe(17);', 1)
          needle = '      "0016_control_plane_transactional_outbox.sql",\n'
          replacement = needle + '      "0017_release_run_outbox_producer.sql",\n'
          if needle not in text:
              raise SystemExit('migration list anchor not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/db/migrations.test.ts
          git commit -m "test(db): register schema v17 migration"
          git push origin "HEAD:${HEAD_REF}"
