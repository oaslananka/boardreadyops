name: pr-debug-diagnostics

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-snapshot
          path: |
            apps/web/lib/control-plane-outbox-worker.ts
            apps/web/lib/github-app-check-run-client.js
            apps/web/lib/runner-client.js
            apps/web/worker.ts
            packages/db/src/control-plane-outbox-store.ts
            tests/unit/web/control-plane-outbox-worker.test.ts
            tests/unit/web/control-plane-worker.test.ts
            tests/unit/web/github-app-check-run-client.test.ts
            tests/unit/web/readiness-result-route.test.ts
            tests/unit/web/runner-client.test.ts
            tests/unit/web/runner-dispatch-details.test.ts

  typecheck-report:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee typecheck-report.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typecheck-report
          path: typecheck-report.txt
      - if: steps.typecheck.outcome == 'failure'
        run: exit 1

  unit-report:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:unit 2>&1 | tee unit-report.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit-report
          path: unit-report.txt
      - if: steps.unit.outcome == 'failure'
        run: exit 1
