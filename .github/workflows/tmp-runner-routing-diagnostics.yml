name: tmp-runner-routing-diagnostics

on:
  pull_request:
    branches:
      - feat/runner-routing-policy

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      DATABASE_URL: postgresql://boardreadyops@127.0.0.1:5432/boardreadyops_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boardreadyops
          POSTGRES_DB: boardreadyops_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardreadyops -d boardreadyops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @boardreadyops/db db:migrate
      - name: Run targeted PostgreSQL tests
        run: |
          set -o pipefail
          mkdir -p diagnostics
          pnpm exec vitest run \
            tests/integration/runner-lease-store-postgres.test.ts \
            tests/integration/runner-routing-policy-postgres.test.ts \
            --no-file-parallelism 2>&1 | tee "diagnostics/node-${{ matrix.node-version }}.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runner-routing-diagnostics-node-${{ matrix.node-version }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
