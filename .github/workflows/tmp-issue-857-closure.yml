name: Temporary issue 857 closure verification

on:
  push:
    branches:
      - issue/857-gerber-parser-regression-closure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm vitest run tests/unit/multicad/gerber-parser.test.ts tests/unit/multicad/gerber-geometry.test.ts
      - run: pnpm run test:property
      - run: pnpm run test:snapshot
      - run: pnpm run test:action
      - run: pnpm run verify:dist
