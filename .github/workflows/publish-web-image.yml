name: publish-web-image

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit SHA to publish.
        required: true
        type: string

concurrency:
  group: publish-web-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: web-image / publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify requested source identity
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::expected_sha must be an exact lowercase commit SHA'; exit 78; }
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo '::error::Only protected main can publish'; exit 78; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo '::error::Dispatch source SHA does not match the intended main revision'; exit 78; }
          echo "version=$(jq -er '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Sign in to the repository-authorized GHCR package
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build and push the exact-source web image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/boardreadyops-full:cloud-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.source.outputs.version }}
            BUILD_DATE=${{ steps.source.outputs.build_date }}
          provenance: mode=max
          sbom: true

      - name: Verify immutable image reference
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/boardreadyops-full
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '::error::Registry digest missing'; exit 1; }
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" >/dev/null
          echo "Published ${IMAGE}@${DIGEST} from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign immutable digest using GitHub OIDC
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/boardreadyops-full
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan published web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/boardreadyops-full@${{ steps.image.outputs.digest }}
          scan-type: image
          severity: HIGH,CRITICAL
          exit-code: '1'
