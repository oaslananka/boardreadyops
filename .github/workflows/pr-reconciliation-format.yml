name: reconciliation-foundation-format

on:
  push:
    branches:
      - cloud/reconciliation-operations-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: cloud/reconciliation-operations-foundation
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:fix
      - run: rm .github/workflows/pr-reconciliation-format.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(db): format reconciliation integration coverage"
          git push origin HEAD:cloud/reconciliation-operations-foundation
