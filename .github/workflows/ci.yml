name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ALLOW_MAJOR_RELEASE: "true"
  DATABASE_URL: postgresql://boardreadyops@127.0.0.1:5432/boardreadyops_toolchain
  NODE_VERSION: "24.19.0"
  UV_VERSION: "0.11.16"

jobs:
  risk-profile:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    name: ci / risk-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needs_lint: ${{ steps.classify.outputs.needs_lint }}
      needs_typecheck: ${{ steps.classify.outputs.needs_typecheck }}
      needs_unit: ${{ steps.classify.outputs.needs_unit }}
      needs_unit_matrix: ${{ steps.classify.outputs.needs_unit_matrix }}
      needs_integration: ${{ steps.classify.outputs.needs_integration }}
      needs_cross_platform: ${{ steps.classify.outputs.needs_cross_platform }}
      needs_action_smoke: ${{ steps.classify.outputs.needs_action_smoke }}
      needs_accessibility: ${{ steps.classify.outputs.needs_accessibility }}
      needs_build: ${{ steps.classify.outputs.needs_build }}
      needs_dist: ${{ steps.classify.outputs.needs_dist }}
      needs_coverage: ${{ steps.classify.outputs.needs_coverage }}
      needs_mutation: ${{ steps.classify.outputs.needs_mutation }}
      needs_security: ${{ steps.classify.outputs.needs_security }}
      needs_sbom: ${{ steps.classify.outputs.needs_sbom }}
      needs_docs: ${{ steps.classify.outputs.needs_docs }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_run: ${{ steps.classify.outputs.full_run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed-files
        name: Detect changed files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=100 origin "${BASE_REF}"
            git diff --name-only "origin/${BASE_REF}...HEAD" > changed-files.txt
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${EVENT_BEFORE}" =~ ^0+$ ]]; then
              git show --name-only --pretty=format: "${HEAD_SHA}" > changed-files.txt
            else
              git diff --name-only "${EVENT_BEFORE}" "${HEAD_SHA}" > changed-files.txt
            fi
          else
            git ls-files > changed-files.txt
          fi
          echo "Changed files:"
          sed 's/^/- /' changed-files.txt
      - id: classify
        name: Classify CI risk
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-risk-profile.mjs changed-files.txt

  lint:
    needs: risk-profile
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    name: ci / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run lint
      - run: pnpm run compatibility:check
      - run: node scripts/check-action-pins.mjs
      - run: pnpm run verify:structure
      - run: pnpm run gc
      - run: pnpm run knip
      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Run workflow security linters
        run: |
          uvx --no-build --from pre-commit==4.6.0 pre-commit run actionlint --all-files
          uvx --no-build --from pre-commit==4.6.0 pre-commit run zizmor --all-files

  typecheck:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_typecheck == 'true'
    name: ci / typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run typecheck

  test-unit:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_unit == 'true'
    name: ci / test-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - name: Detect Mergify CI Insights credential
        id: mergify-token
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          if [ -n "${MERGIFY_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Mergify CI Insights upload is disabled because MERGIFY_TOKEN is not configured."
          fi
      - name: Run unit tests with JUnit report
        id: tests
        run: pnpm run test:unit --reporter=default --reporter=junit --outputFile.junit=junit.xml
        continue-on-error: true
      - name: Upload test results to Mergify CI Insights
        if: ${{ always() && steps.mergify-token.outputs.enabled == 'true' }}
        uses: Mergifyio/gha-mergify-ci@f16859b8b4496abe98768bed352d5d9c969a2793
        continue-on-error: true
        with:
          action: junit-process
          report_path: junit.xml
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: ci / test-unit
          test_step_outcome: ${{ steps.tests.outcome }}
      - name: Enforce test result
        if: ${{ always() && steps.tests.outcome != 'success' }}
        run: exit 1

  test-unit-matrix:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_unit_matrix == 'true'
    name: ci / test-unit-matrix (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025-vs2026
          - macos-latest
        node-version:
          - 22
          - 24
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - name: Detect Mergify CI Insights credential
        id: mergify-token
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          if [ -n "${MERGIFY_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Mergify CI Insights upload is disabled because MERGIFY_TOKEN is not configured."
          fi
      - name: Run unit tests with JUnit report
        id: tests
        run: pnpm run test:unit --reporter=default --reporter=junit --outputFile.junit=junit.xml
        continue-on-error: true
      - name: Upload test results to Mergify CI Insights
        if: ${{ always() && steps.mergify-token.outputs.enabled == 'true' }}
        uses: Mergifyio/gha-mergify-ci@f16859b8b4496abe98768bed352d5d9c969a2793
        continue-on-error: true
        with:
          action: junit-process
          report_path: junit.xml
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: ci / test-unit-matrix (${{ matrix.os }}, Node ${{ matrix.node-version }})
          test_step_outcome: ${{ steps.tests.outcome }}
      - name: Enforce test result
        if: ${{ always() && steps.tests.outcome != 'success' }}
        run: exit 1

  test-int:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_integration == 'true'
    name: ci / test-int (KiCad ${{ matrix.kicad-version }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BOARDREADYOPS_POSTGRES_TESTS: "true"
      BOARDREADYOPS_BACKUP_RESTORE_TESTS: "true"
      DATABASE_URL: postgresql://boardreadyops@127.0.0.1:5432/boardreadyops_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boardreadyops
          POSTGRES_DB: boardreadyops_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardreadyops -d boardreadyops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - kicad-version: "10.0"
            kicad-ppa-series: "10.0"
            node-version: 22
          - kicad-version: "10.0"
            kicad-ppa-series: "10.0"
            node-version: 24
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - name: Install KiCad ${{ matrix.kicad-version }}
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes "ppa:kicad/kicad-${{ matrix.kicad-ppa-series }}-releases"
          sudo apt-get update -qq
          sudo apt-get install --yes kicad
          version="$(kicad-cli version)"
          echo "kicad-cli ${version}"
          if [[ "${version}" != "${{ matrix.kicad-version }}".* ]]; then
            echo "::error::Expected KiCad ${{ matrix.kicad-version }}.*, got ${version}"
            exit 1
          fi
      - name: Install PostgreSQL client
        run: sudo apt-get install --yes postgresql-client
      - run: corepack pnpm run deps:install-ci
      - name: Apply cloud migrations
        run: pnpm --filter @boardreadyops/db db:migrate
      - name: Detect Mergify CI Insights credential
        id: mergify-token
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          if [ -n "${MERGIFY_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Mergify CI Insights upload is disabled because MERGIFY_TOKEN is not configured."
          fi
      - name: Run integration tests with JUnit report
        id: tests
        run: pnpm run test:int --reporter=junit --outputFile=junit.xml
        continue-on-error: true
      - name: Upload test results to Mergify CI Insights
        if: ${{ always() && steps.mergify-token.outputs.enabled == 'true' }}
        uses: Mergifyio/gha-mergify-ci@f16859b8b4496abe98768bed352d5d9c969a2793
        continue-on-error: true
        with:
          action: junit-process
          report_path: junit.xml
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: ci / test-int (KiCad ${{ matrix.kicad-version }}, Node ${{ matrix.node-version }})
          test_step_outcome: ${{ steps.tests.outcome }}
      - name: Enforce test result
        if: ${{ always() && steps.tests.outcome != 'success' }}
        run: exit 1

  cross-platform-paths:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_cross_platform == 'true'
    name: ci / cross-platform-paths (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-2025-vs2026
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - name: Detect Mergify CI Insights credential
        id: mergify-token
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          if [ -n "${MERGIFY_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Mergify CI Insights upload is disabled because MERGIFY_TOKEN is not configured."
          fi
      - name: Run cross-platform tests with JUnit report
        id: tests
        run: pnpm exec vitest run tests/integration/cross-platform-paths.test.ts --reporter=junit --outputFile=junit.xml
        continue-on-error: true
      - name: Upload test results to Mergify CI Insights
        if: ${{ always() && steps.mergify-token.outputs.enabled == 'true' }}
        uses: Mergifyio/gha-mergify-ci@f16859b8b4496abe98768bed352d5d9c969a2793
        continue-on-error: true
        with:
          action: junit-process
          report_path: junit.xml
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: ci / cross-platform-paths (${{ matrix.os }})
          test_step_outcome: ${{ steps.tests.outcome }}
      - name: Enforce test result
        if: ${{ always() && steps.tests.outcome != 'success' }}
        run: exit 1

  test-action:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_action_smoke == 'true'
    name: ci / test-action
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - name: Detect Mergify CI Insights credential
        id: mergify-token
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          if [ -n "${MERGIFY_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Mergify CI Insights upload is disabled because MERGIFY_TOKEN is not configured."
          fi
      - name: Run action tests with JUnit report
        id: tests
        run: pnpm run test:action --reporter=junit --outputFile=junit.xml
        continue-on-error: true
      - name: Upload test results to Mergify CI Insights
        if: ${{ always() && steps.mergify-token.outputs.enabled == 'true' }}
        uses: Mergifyio/gha-mergify-ci@f16859b8b4496abe98768bed352d5d9c969a2793
        continue-on-error: true
        with:
          action: junit-process
          report_path: junit.xml
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: ci / test-action
          test_step_outcome: ${{ steps.tests.outcome }}
      - name: Enforce test result
        if: ${{ always() && steps.tests.outcome != 'success' }}
        run: exit 1

  docs-build:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_docs == 'true'
    name: ci / docs-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install Python docs dependencies
        run: |
          docs_venv="${RUNNER_TEMP}/boardreadyops-docs-venv"
          uv venv "${docs_venv}"
          uv pip install --python "${docs_venv}/bin/python" --require-hashes -r docs/requirements.lock.txt
          echo "${docs_venv}/bin" >> "${GITHUB_PATH}"
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run docs
        env:
          NO_MKDOCS_2_WARNING: "1"
      - run: node scripts/docs-build.mjs --site-dir site
        env:
          NO_MKDOCS_2_WARNING: "1"

  accessibility:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_accessibility == 'true'
    name: ci / accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install Python docs dependencies
        run: |
          docs_venv="${RUNNER_TEMP}/boardreadyops-docs-venv"
          uv venv "${docs_venv}"
          uv pip install --python "${docs_venv}/bin/python" --require-hashes -r docs/requirements.lock.txt
          echo "${docs_venv}/bin" >> "${GITHUB_PATH}"
      - run: corepack pnpm run deps:install-ci
      - name: Verify Chrome for pa11y
        run: google-chrome --version
      - run: pnpm run test:a11y

  build:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_build == 'true'
    name: ci / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run build
      - name: Build cloud application
        run: pnpm run cloud:build
      - name: Upload Codecov bundle analysis
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: pnpm run codecov:bundle

  web-standalone-windows:
    needs: risk-profile
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      (needs.risk-profile.outputs.needs_build == 'true' || needs.risk-profile.outputs.needs_integration == 'true')
    name: ci / web-standalone-windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run build
      - run: pnpm --filter @boardreadyops/web build
      - run: pnpm run verify:web-standalone

  verify-dist:
    needs:
      - risk-profile
      - build
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_dist == 'true'
    name: ci / verify-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run verify:dist

  coverage-gate:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_coverage == 'true'
    name: ci / coverage-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run coverage:ci
      - name: Upload bounded coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ failure() || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Codecov configuration
        if: ${{ !cancelled() }}
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-all-errors
          --data-binary @codecov.yml
          https://codecov.io/validate
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          disable_search: true
          files: coverage/lcov.info
          fail_ci_if_error: false
          flags: core
          name: boardreadyops-core-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          disable_search: true
          files: coverage/test-results.junit.xml
          fail_ci_if_error: false
          flags: core
          name: boardreadyops-core-tests
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload cloud coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          disable_search: true
          files: coverage/cloud/lcov.info
          fail_ci_if_error: false
          flags: cloud
          name: boardreadyops-cloud-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload cloud test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          disable_search: true
          files: coverage/cloud/test-results.junit.xml
          fail_ci_if_error: false
          flags: cloud
          name: boardreadyops-cloud-tests
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  mutation:
    needs: risk-profile
    name: ci / mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_mutation == 'true' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run mutation
      - name: Check mutation thresholds
        if: always()
        run: pnpm run mutation:check --summary
      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 7

  security:
    needs: risk-profile
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_security == 'true'
    name: ci / security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run security
      - name: Assert compliance checks did not mutate the checkout
        run: git diff --exit-code

  sbom:
    needs: risk-profile
    name: ci / sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && needs.risk-profile.outputs.needs_sbom == 'true' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 7
