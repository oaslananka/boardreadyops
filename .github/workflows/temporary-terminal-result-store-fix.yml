name: temporary-terminal-result-store-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.repository_owner == 'oaslananka' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Update schema contract and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("tests/unit/db/migrations.test.ts")
          text = target.read_text()
          text = text.replace("expect(cloudDatabaseSchemaVersion).toBe(11);", "expect(cloudDatabaseSchemaVersion).toBe(12);", 1)
          migration_marker = '      "0011_runner_artifact_upload_capabilities.sql",\n'
          if '"0012_runner_terminal_result_authorization.sql"' not in text:
            if migration_marker not in text:
              raise SystemExit("migration list marker not found")
            text = text.replace(
              migration_marker,
              migration_marker + '      "0012_runner_terminal_result_authorization.sql",\n',
              1,
            )

          test_marker = '  it("keeps the release-run lifecycle index migration idempotent", async () => {'
          block = '''  it("authorizes signed terminal results with body-bound nonce replay protection in schema v12", async () => {
            const sql = await readFile(join(migrationsDir, "0012_runner_terminal_result_authorization.sql"), "utf8");

            expect(sql).toContain("add column if not exists request_digest text");
            expect(sql).toContain("runner_request_nonces_request_digest_valid");
            expect(sql).toContain("boardreadyops_authorize_runner_terminal_result");
            expect(sql).toContain("runner_job_leases.lease_token_digest = p_lease_token_digest");
            expect(sql).toContain("release_runs.execution_attempt_id = runner_job_leases.execution_attempt_id");
            expect(sql).toContain("persisted_request_digest = p_request_digest");
            expect(sql).toContain("return 'conflicting_replay'");
            expect(sql).toContain("security invoker");
          });

          '''
          if "authorizes signed terminal results with body-bound nonce replay protection" not in text:
            if test_marker not in text:
              raise SystemExit("migration unit test insertion marker not found")
            text = text.replace(test_marker, block + test_marker, 1)
          target.write_text(text)
          PY
          pnpm exec biome check --write \
            packages/db/package.json \
            packages/db/src/index.ts \
            packages/db/src/runner-terminal-result-store.ts \
            tests/unit/db/migrations.test.ts \
            tests/integration/runner-terminal-result-authorizer-postgres.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/db/package.json \
            packages/db/src/index.ts \
            packages/db/src/runner-terminal-result-store.ts \
            tests/unit/db/migrations.test.ts \
            tests/integration/runner-terminal-result-authorizer-postgres.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "test(db): cover terminal result authorization schema"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
