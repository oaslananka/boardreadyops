# TEST FIXTURE ONLY. Do not use this attestation as fabrication approval or a customer delivery.
# The exact KiCad source lives in this public repository and is intentionally synthetic.
# Manual dispatch on the protected main branch. Fails closed for other refs.
name: Manufacturing fixture attestation smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  attest-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout protected exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require protected main (never attest PR or unprotected sources)
        shell: bash
        env:
          PROTECTED_REF: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$PROTECTED_REF" == "true" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and check KiCad 10
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install --yes kicad
          [[ "$(kicad-cli version)" == 10.0.* ]]
      - name: Export exact Gerber, drill, BOM and CPL bytes from test fixture
        id: export
        uses: ./.github/actions/manufacturing-attested-export
        with:
          reviewed-source-sha: ${{ github.sha }}
          project: tests/fixtures/projects/safe-basic/safe-basic.kicad_pro
      - name: Install pinned GitHub attestation library
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/attest-tools" --no-audit --no-fund --ignore-scripts --save-exact @actions/attest@3.2.0
      - name: Sign test fixture export inventory with GitHub-internal Sigstore
        id: internal
        shell: bash
        env:
          SUBJECTS: ${{ steps.export.outputs.subject-checksums }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/attest-tools/sign.mjs" <<'JSCODE'
          import fs from 'node:fs';
          import {attestProvenance} from '@actions/attest';
          const pattern=/^([a-f0-9]{64})  ([a-zA-Z0-9_.\/-]+)$/u;
          const lines=fs.readFileSync(process.env.SUBJECTS,'utf8').trimEnd().split('\n');
          const names=new Set();
          const subjects=lines.map(line=>{
            const m=pattern.exec(line);
            if(!m || names.has(m[2]) || m[2].split('/').some(x=>x===''||x==='.'||x==='..')) throw new Error('Unsafe subject checksum list');
            names.add(m[2]);
            return {name:m[2],digest:{sha256:m[1]}};
          });
          if(subjects.length<3 || !subjects.some(x=>x.name.endsWith('/manifest.json'))) throw new Error('Incomplete export');
          const result=await attestProvenance({
            subjects,
            token:process.env.GH_TOKEN,
            sigstore:'github',
            skipWrite:true,
          });
          if(result.attestationID||result.tlogID) throw new Error('Unexpected remote persistence');
          const bundle=process.env.RUNNER_TEMP+'/boardreadyops-internal-export.sigstore.json';
          fs.writeFileSync(bundle,JSON.stringify(result.bundle),{mode:0o600});
          const verify=JSON.parse(fs.readFileSync(bundle,'utf8'));
          if((verify?.verificationMaterial?.tlogEntries??[]).length!==0) throw new Error('Unexpected public transparency log entry');
          if((verify?.verificationMaterial?.timestampVerificationData?.rfc3161Timestamps??[]).length===0) throw new Error('No signed internal timestamp');
          console.log('GitHub-internal signed SLSA bundle created for '+subjects.length+' fixture subjects (no attestations API storage).');
          JSCODE
          node "$RUNNER_TEMP/attest-tools/sign.mjs"
      - name: Retain test-only Sigstore bundle for offline verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-fixture-sigstore-bundle
          path: ${{ runner.temp }}/boardreadyops-internal-export.sigstore.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain test-only export for independent byte verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-fixture-attested-manufacturing-export
          path: ${{ steps.export.outputs.export-directory }}/
          if-no-files-found: error
          retention-days: 7
