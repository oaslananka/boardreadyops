name: temporary-biome-format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    if: github.repository_owner == 'oaslananka'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Format changed TypeScript
        run: >-
          pnpm exec biome check --write
          packages/db/src/runner-lease-store.ts
          tests/integration/runner-lease-store-postgres.test.ts
          tests/unit/db/migrations.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: biome-formatted-runner-lease
          path: |
            packages/db/src/runner-lease-store.ts
            tests/integration/runner-lease-store-postgres.test.ts
            tests/unit/db/migrations.test.ts
