name: temporary-artifact-route-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.repository_owner == 'oaslananka' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic route fix and formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("apps/web/lib/runner-artifact-routes.ts")
          text = target.read_text()
          marker = "function isInside(root: string, candidate: string): boolean {"
          helper = '''function hasHttpsPublicBaseUrl(environment: Readonly<Record<string, string | undefined>>): boolean {
            const baseUrl = environment.BOARDREADYOPS_PUBLIC_URL ?? environment.NEXT_PUBLIC_APP_URL;
            if (!baseUrl) return false;
            try {
              return new URL(baseUrl).protocol === "https:";
            } catch {
              return false;
            }
          }

          '''
          if "function hasHttpsPublicBaseUrl" not in text:
            text = text.replace(marker, helper + marker)

          auth_marker = '''  if (!authenticated) {
              return jsonResponse({ ok: false, error: "invalid runner request authentication" }, 401);
            }

            try {'''
          replacement = '''  if (!authenticated) {
              return jsonResponse({ ok: false, error: "invalid runner request authentication" }, 401);
            }
            if (!hasHttpsPublicBaseUrl(dependencies.environment)) {
              return jsonResponse({ ok: false, error: "HTTPS public URL is not configured" }, 503);
            }

            try {'''
          if "HTTPS public URL is not configured" not in text.split("try {", 2)[1]:
            text = text.replace(auth_marker, replacement)
          target.write_text(text)
          PY
          pnpm exec biome check --write \
            apps/web/lib/runner-artifact-routes.ts \
            apps/web/app/api/v1/runner/artifacts/capabilities/route.ts \
            'apps/web/app/api/v1/runner/artifacts/[artifactId]/upload/route.ts' \
            tests/unit/web/runner-artifact-routes.test.ts
          pnpm run typecheck
          pnpm exec vitest run tests/unit/web/runner-artifact-routes.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/lib/runner-artifact-routes.ts \
            apps/web/app/api/v1/runner/artifacts/capabilities/route.ts \
            'apps/web/app/api/v1/runner/artifacts/[artifactId]/upload/route.ts' \
            tests/unit/web/runner-artifact-routes.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(runner): validate artifact transport configuration"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
