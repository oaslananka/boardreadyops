name: tmp-release-1-12-audit

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Wait for container release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: "b9c22382638724778d0fa8bcbaab2c47665f5f67"
          VERSION: "1.12.0"
        run: |
          set -euo pipefail
          mkdir -p audit-output
          exec > >(tee audit-output/container-workflow.txt) 2>&1

          selected_run_id=""
          for attempt in $(seq 1 75); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/oaslananka/boardreadyops/actions/workflows/container-build.yml/runs?event=push&per_page=100' \
              -o audit-output/container-runs.json

            selected="$(jq -c --arg sha "${RELEASE_COMMIT}" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last // empty' \
              audit-output/container-runs.json)"
            if [ -z "${selected}" ]; then
              echo "container-build run for ${RELEASE_COMMIT} is not visible yet; attempt ${attempt}/75"
              sleep 20
              continue
            fi

            selected_run_id="$(jq -r '.id' <<<"${selected}")"
            status="$(jq -r '.status' <<<"${selected}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${selected}")"
            echo "container-build run=${selected_run_id} status=${status} conclusion=${conclusion:-pending} attempt=${attempt}/75"

            if [ "${status}" != "completed" ]; then
              sleep 20
              continue
            fi

            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/oaslananka/boardreadyops/actions/runs/${selected_run_id}/jobs?per_page=100" \
              -o audit-output/container-jobs.json
            jq '{total_count,jobs:[.jobs[]|{id,name,status,conclusion,started_at,completed_at}]}' \
              audit-output/container-jobs.json

            if [ "${conclusion}" != "success" ]; then
              echo "::error::container-build release run completed with ${conclusion}"
              exit 1
            fi
            break
          done

          if [ -z "${selected_run_id}" ]; then
            echo "::error::container-build release run was not found"
            exit 1
          fi
          final_status="$(jq -r --argjson id "${selected_run_id}" '.workflow_runs[] | select(.id == $id) | .status' audit-output/container-runs.json)"
          final_conclusion="$(jq -r --argjson id "${selected_run_id}" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")' audit-output/container-runs.json)"
          if [ "${final_status}" != "completed" ] || [ "${final_conclusion}" != "success" ]; then
            echo "::error::container-build did not complete successfully within the audit window"
            exit 1
          fi
          printf '%s\n' "${selected_run_id}" > audit-output/container-run-id.txt

      - name: Verify anonymous GHCR manifests and runtime
        env:
          VERSION: "1.12.0"
        run: |
          set -euo pipefail
          exec > >(tee audit-output/ghcr-audit.txt) 2>&1
          image="ghcr.io/oaslananka/boardreadyops-full"

          inspect_image() {
            local reference="$1"
            local output="$2"
            local errors="$3"
            local attempt
            for attempt in $(seq 1 30); do
              echo "inspect ${reference}: attempt ${attempt}/30"
              if docker buildx imagetools inspect "${reference}" >"${output}" 2>"${errors}"; then
                cat "${output}"
                return 0
              fi
              cat "${errors}"
              sleep 15
            done
            return 1
          }

          inspect_image "${image}:v${VERSION}" audit-output/ghcr-exact.txt audit-output/ghcr-exact.err
          inspect_image "${image}:v1" audit-output/ghcr-v1.txt audit-output/ghcr-v1.err
          inspect_image "${image}:latest" audit-output/ghcr-latest.txt audit-output/ghcr-latest.err

          exact="$(awk '/^Digest:/ {print $2; exit}' audit-output/ghcr-exact.txt)"
          major="$(awk '/^Digest:/ {print $2; exit}' audit-output/ghcr-v1.txt)"
          latest="$(awk '/^Digest:/ {print $2; exit}' audit-output/ghcr-latest.txt)"
          echo "v${VERSION}=${exact}"
          echo "v1=${major}"
          echo "latest=${latest}"
          test -n "${exact}"
          test "${exact}" = "${major}"
          test "${exact}" = "${latest}"
          grep -q 'linux/amd64' audit-output/ghcr-exact.txt
          grep -q 'linux/arm64' audit-output/ghcr-exact.txt

          container_version="$(docker run --rm --entrypoint boardreadyops "${image}:v${VERSION}" --version)"
          echo "container_cli_version=${container_version}"
          test "${container_version}" = "${VERSION}"
          echo "PUBLIC_GHCR_AUDIT=PASS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-1.12.0-ghcr-audit
          path: audit-output
          if-no-files-found: error
          retention-days: 7
