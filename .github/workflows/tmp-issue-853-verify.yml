name: Temporary issue 853 verification and bundles

on:
  push:
    branches:
      - issue/853-board-edge-feature-geometry

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - run: pnpm vitest run tests/unit/rules/manufacturing/board-edge-clearance.test.ts tests/unit/multicad/gerber-geometry.test.ts
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run verify:dist
      - name: Commit regenerated bundles
        shell: bash
        run: |
          if git diff --quiet -- dist/action/index.cjs dist/cli/index.cjs; then
            echo "Bundles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/action/index.cjs dist/cli/index.cjs
          git commit -m "build: regenerate board-edge geometry bundles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
