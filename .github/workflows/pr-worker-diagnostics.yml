name: pr-worker-diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'cloud/crash-recoverable-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          pnpm run typecheck > typecheck.log 2>&1
          echo "$?" > typecheck.exit
          pnpm run gc > gc.log 2>&1
          echo "$?" > gc.exit
          pnpm run docs > docs.log 2>&1
          echo "$?" > docs.exit
          pnpm run cloud:build > cloud-build.log 2>&1
          echo "$?" > cloud-build.exit
          pnpm exec vitest run tests/unit/web/control-plane-worker-runtime.test.ts tests/unit/scripts/verify-control-plane-worker-boundary.test.ts > focused-tests.log 2>&1
          echo "$?" > focused-tests.exit
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-hardening-diagnostics
          path: |
            *.log
            *.exit
