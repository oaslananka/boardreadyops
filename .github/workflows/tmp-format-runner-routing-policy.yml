name: tmp-format-runner-routing-policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/runner-routing-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Fix generated formatting and remove formatter
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("tests/unit/db/migrations.test.ts")
          text = path.read_text()
          before = '''  it("stores tenant-scoped execution routing policies in schema v14", async () => {
            const sql = await readFile(join(migrationsDir, "0014_runner_execution_routing_policies.sql"), "utf8");

            expect(sql).toContain("create table if not exists runner_execution_policies");
            expect(sql).toContain("runner_execution_policies_repository_scope_fk");
            expect(sql).toContain("managed_only");
            expect(sql).toContain("self_hosted_required");
            expect(sql).toContain("self_hosted_preferred");
            expect(sql).toContain("boardreadyops_effective_runner_policy");
            expect(sql).toContain("policy_source");
            expect(sql).toContain("no_eligible_self_hosted_runner_online");
            expect(sql).toContain("routingPolicyMode");
            expect(sql).toContain("routingPolicySource");
            expect(sql).toContain("for update of release_runs skip locked");
            expect(sql).toContain("security invoker");
          });
          '''
          after = '''  it("stores tenant-scoped execution routing policies in schema v14", async () => {
            const sql = await readFile(join(migrationsDir, "0014_runner_execution_routing_policies.sql"), "utf8");

            expect(sql).toContain("create table if not exists runner_execution_policies");
            expect(sql).toContain("runner_execution_policies_repository_scope_fk");
            expect(sql).toContain("managed_only");
            expect(sql).toContain("self_hosted_required");
            expect(sql).toContain("self_hosted_preferred");
            expect(sql).toContain("boardreadyops_effective_runner_policy");
            expect(sql).toContain("policy_source");
            expect(sql).toContain("no_eligible_self_hosted_runner_online");
            expect(sql).toContain("routingPolicyMode");
            expect(sql).toContain("routingPolicySource");
            expect(sql).toContain("for update of release_runs skip locked");
            expect(sql).toContain("security invoker");
          });
          '''
          # The generated file may have lost six leading spaces in the body.
          malformed = '''  it("stores tenant-scoped execution routing policies in schema v14", async () => {
  const sql = await readFile(join(migrationsDir, "0014_runner_execution_routing_policies.sql"), "utf8");

  expect(sql).toContain("create table if not exists runner_execution_policies");
  expect(sql).toContain("runner_execution_policies_repository_scope_fk");
  expect(sql).toContain("managed_only");
  expect(sql).toContain("self_hosted_required");
  expect(sql).toContain("self_hosted_preferred");
  expect(sql).toContain("boardreadyops_effective_runner_policy");
  expect(sql).toContain("policy_source");
  expect(sql).toContain("no_eligible_self_hosted_runner_online");
  expect(sql).toContain("routingPolicyMode");
  expect(sql).toContain("routingPolicySource");
  expect(sql).toContain("for update of release_runs skip locked");
  expect(sql).toContain("security invoker");
});
'''
          if malformed not in text:
              raise SystemExit("expected malformed generated block was not found")
          text = text.replace(malformed, after)
          path.write_text(text)
          PY
          rm .github/workflows/tmp-format-runner-routing-policy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/db/migrations.test.ts .github/workflows/tmp-format-runner-routing-policy.yml
          git commit -m "style(db): format runner routing migration test"
          git push origin HEAD:${{ github.head_ref }}
