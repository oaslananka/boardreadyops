name: temporary-artifact-route-diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.repository_owner == 'oaslananka' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Apply route type and replay fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path("apps/web/lib/runner-artifact-routes.ts")
          text = route.read_text()

          auth_marker = '''  if (!authenticated) {
            return jsonResponse({ ok: false, error: "invalid runner request authentication" }, 401);
          }

          try {'''
          auth_replacement = '''  if (!authenticated) {
            return jsonResponse({ ok: false, error: "invalid runner request authentication" }, 401);
          }
          if (!hasHttpsPublicBaseUrl(dependencies.environment)) {
            return jsonResponse({ ok: false, error: "HTTPS public URL is not configured" }, 503);
          }

          try {'''
          if "if (!hasHttpsPublicBaseUrl(dependencies.environment))" not in text:
            if auth_marker not in text:
              raise SystemExit("authenticated capability marker not found")
            text = text.replace(auth_marker, auth_replacement, 1)

          text = text.replace(
            "      artifacts: parsed.data.artifacts,",
            '''      artifacts: parsed.data.artifacts.map((artifact) => ({
                kind: artifact.kind,
                name: artifact.name,
                role: artifact.role,
                bytes: artifact.bytes,
                ...(artifact.sha256 === undefined ? {} : { sha256: artifact.sha256 }),
              })),''',
            1,
          )

          result_marker = '''    if (result.status === "replayed") {
              return jsonResponse({ ok: false, error: "artifact capability request was replayed" }, 409);
            }
            if (result.status === "stale") {
              return jsonResponse({ ok: false, error: "runner lease is stale" }, 409);
            }
          '''
          result_replacement = '''    if (result.status !== "accepted") {
              return result.status === "replayed"
                ? jsonResponse({ ok: false, error: "artifact capability request was replayed" }, 409)
                : jsonResponse({ ok: false, error: "runner lease is stale" }, 409);
            }
          '''
          if result_marker not in text:
            raise SystemExit("capability result marker not found")
          text = text.replace(result_marker, result_replacement, 1)

          begun_marker = '''  if (begun.status === "expired") return jsonResponse({ ok: false, error: "artifact upload capability expired" }, 410);
            if (begun.status === "replayed")
              return jsonResponse({ ok: false, error: "artifact upload capability was already used" }, 409);
            if (begun.status === "stale") return jsonResponse({ ok: false, error: "artifact upload capability is invalid" }, 403);
          '''
          begun_replacement = '''  if (begun.status !== "accepted") {
              if (begun.status === "expired") {
                return jsonResponse({ ok: false, error: "artifact upload capability expired" }, 410);
              }
              return begun.status === "replayed"
                ? jsonResponse({ ok: false, error: "artifact upload capability was already used" }, 409)
                : jsonResponse({ ok: false, error: "artifact upload capability is invalid" }, 403);
            }
          '''
          if begun_marker not in text:
            raise SystemExit("begin result marker not found")
          text = text.replace(begun_marker, begun_replacement, 1)
          route.write_text(text)

          test = Path("tests/unit/web/runner-artifact-routes.test.ts")
          test_text = test.read_text()
          reset_marker = '''  failUpload.mockReset();
            query.mockResolvedValue({ rows: [{ public_key: publicKey }] });'''
          reset_replacement = '''  failUpload.mockReset();
            failUpload.mockResolvedValue({ status: "accepted" });
            query.mockResolvedValue({ rows: [{ public_key: publicKey }] });'''
          if reset_marker not in test_text:
            raise SystemExit("test reset marker not found")
          test.write_text(test_text.replace(reset_marker, reset_replacement, 1))
          PY
          pnpm exec biome check --write \
            apps/web/lib/runner-artifact-routes.ts \
            tests/unit/web/runner-artifact-routes.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/runner-artifact-routes.ts tests/unit/web/runner-artifact-routes.test.ts
          git commit -m "fix(runner): narrow artifact transport outcomes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
