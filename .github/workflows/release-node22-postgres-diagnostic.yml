name: release-node22-postgres-diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://boardreadyops@127.0.0.1:5432/boardreadyops_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boardreadyops
          POSTGRES_DB: boardreadyops_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardreadyops -d boardreadyops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @boardreadyops/db db:migrate
      - name: Run PostgreSQL integration files and capture output
        shell: bash
        run: |
          set +e
          pnpm exec vitest run tests/integration/*postgres.test.ts --reporter=verbose --no-color 2>&1 | tee release-node22-postgres.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "${status}" > release-node22-postgres.exit
          exit 0
      - name: Upload PostgreSQL diagnostic output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-node22-postgres-diagnostic
          path: |
            release-node22-postgres.log
            release-node22-postgres.exit
      - name: Preserve failing status
        run: exit "$(cat release-node22-postgres.exit)"
