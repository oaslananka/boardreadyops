name: format-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  biome-format:
    name: format-diagnostics / biome-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Apply formatter output
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm exec biome format --write .
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/control-plane-outbox-store.ts \
            tests/integration/control-plane-outbox-postgres.test.ts \
            tests/unit/db/control-plane-outbox-migration.test.ts \
            tests/unit/db/control-plane-outbox-store.test.ts
          git commit -m "style: apply Biome formatting"
          git push origin "HEAD:${HEAD_REF}"
