name: security

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "*.md"
      - mkdocs.yml
      - .coderabbit.yaml
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.20.0"

  SCORECARD_CHECKS: Dangerous-Workflow,Dependency-Update-Tool,Fuzzing,License,Pinned-Dependencies,SAST,Security-Policy,Token-Permissions,Vulnerabilities
  SCORECARD_IMAGE: ghcr.io/ossf/scorecard:v5.5.0@sha256:3f24714e9366917adb7a05635382c97dfecb14b21eaef3dfa2ea48c8e23e0795
  SCORECARD_MIN_SCORE: "9.0"

jobs:
  policy:
    name: security / policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      dependency_changed: ${{ steps.classify.outputs.dependency_changed }}
      needs_security: ${{ steps.classify.outputs.needs_security }}
      needs_sbom: ${{ steps.classify.outputs.needs_sbom }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed-files
        name: Detect changed files
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=100 origin "${BASE_REF}"
            git diff --name-only "origin/${BASE_REF}...HEAD" > changed-files.txt
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${EVENT_BEFORE}" =~ ^0+$ ]]; then
              git show --name-only --pretty=format: "${HEAD_SHA}" > changed-files.txt
            else
              git diff --name-only "${EVENT_BEFORE}" "${HEAD_SHA}" > changed-files.txt
            fi
          else
            git ls-files > changed-files.txt
          fi
          echo "Changed files:"
          sed 's/^/- /' changed-files.txt
      - id: classify
        name: Classify security policy
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-risk-profile.mjs changed-files.txt

  dependency-review:
    needs: policy
    name: security / dependency-review
    if: github.event_name == 'pull_request' && needs.policy.outputs.dependency_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never


  osv-pull-request:
    needs: policy
    name: security / osv dependency diff
    if: github.event_name == 'pull_request' && needs.policy.outputs.dependency_changed == 'true'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  osv-full:
    needs: policy
    name: security / osv full scan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  compliance:
    needs: policy
    name: security / repository compliance
    if: needs.policy.outputs.needs_security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run security
      - name: Assert compliance checks did not mutate the checkout
        run: git diff --exit-code

  codeql:
    needs: policy
    if: needs.policy.outputs.code_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: security / codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e

  semgrep:
    needs: policy
    if: needs.policy.outputs.code_changed == 'true'
    name: security / semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.170.0
      - name: Enforce BoardReadyOps Semgrep rules
        run: semgrep scan --config .semgrep.yml --error --metrics=off .
      - name: Generate Semgrep SARIF with community rules
        run: >-
          semgrep scan
          --config .semgrep.yml
          --config p/typescript
          --config p/nodejs
          --config p/owasp-top-ten
          --config p/github-actions
          --metrics=off
          --sarif
          --output semgrep.sarif
          .
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    needs: policy
    name: security / gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/gitleaks-install"
          mkdir -p "${workdir}"
          cd "${workdir}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksum_file="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --proto '=https' --proto-redir '=https' -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --proto '=https' --proto-redir '=https' -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${checksum_file}"
          grep " ${archive}$" "${checksum_file}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --verbose

  sbom:
    needs: policy
    if: needs.policy.outputs.needs_sbom == 'true'
    name: security / sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 7

  scorecard:
    name: security / scorecard advisory
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Run enforced Scorecard baseline
        continue-on-error: true
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_AUTH_TOKEN \
            "${SCORECARD_IMAGE}" \
            --repo="github.com/${GITHUB_REPOSITORY}" \
            --checks="${SCORECARD_CHECKS}" \
            --show-details \
            --format=json > scorecard.json
          node scripts/check-scorecard-baseline.mjs \
            --report scorecard.json \
            --minimum "${SCORECARD_MIN_SCORE}" \
            --checks "${SCORECARD_CHECKS}" \
            --summary
      - name: Upload scorecard baseline
        if: always() && hashFiles('scorecard.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scorecard-baseline
          path: scorecard.json
          retention-days: 7

  gate:
    name: security / gate
    if: always()
    needs:
      - policy
      - dependency-review
      - osv-pull-request
      - osv-full
      - compliance
      - codeql
      - semgrep
      - gitleaks
      - sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Evaluate mandatory security results
        env:
          SECURITY_GATE_INPUT: >-
            {"eventName":"${{ github.event_name }}","forkPullRequest":${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }},"policy":{"codeScan":${{ needs.policy.outputs.code_changed == 'true' }},"dependencyScan":${{ needs.policy.outputs.dependency_changed == 'true' }},"compliance":${{ needs.policy.outputs.needs_security == 'true' }},"sbom":${{ needs.policy.outputs.needs_sbom == 'true' }}},"results":{"policy":"${{ needs.policy.result }}","codeql":"${{ needs.codeql.result }}","semgrep":"${{ needs.semgrep.result }}","gitleaks":"${{ needs.gitleaks.result }}","dependencyReview":"${{ needs.dependency-review.result }}","osvPullRequest":"${{ needs.osv-pull-request.result }}","osvFull":"${{ needs.osv-full.result }}","compliance":"${{ needs.compliance.result }}","sbom":"${{ needs.sbom.result }}"}}
        run: node scripts/security-gate.mjs
