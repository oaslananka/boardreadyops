name: pr-worker-format

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'cloud/crash-recoverable-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec biome check --write
          apps/web/worker.ts
          apps/web/lib/control-plane-worker-runtime.ts
          scripts/build-control-plane-worker.mjs
          scripts/verify-control-plane-worker-boundary.mjs
          tests/unit/web/control-plane-worker-runtime.test.ts
          tests/unit/scripts/verify-control-plane-worker-boundary.test.ts
          package.json
          docs/deployment/self-hosted.md
          docs/superpowers/specs/2026-07-22-crash-recoverable-worker-design.md
          docs/superpowers/plans/2026-07-22-crash-recoverable-worker.md
      - name: Commit formatting
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add apps/web/worker.ts apps/web/lib/control-plane-worker-runtime.ts \
            scripts/build-control-plane-worker.mjs scripts/verify-control-plane-worker-boundary.mjs \
            tests/unit/web/control-plane-worker-runtime.test.ts \
            tests/unit/scripts/verify-control-plane-worker-boundary.test.ts \
            package.json docs/deployment/self-hosted.md \
            docs/superpowers/specs/2026-07-22-crash-recoverable-worker-design.md \
            docs/superpowers/plans/2026-07-22-crash-recoverable-worker.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(cloud): format worker hardening changes"
          git push origin "HEAD:${HEAD_REF}"
