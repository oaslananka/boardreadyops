name: temporary-runner-lease-node22-diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.repository_owner == 'oaslananka'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boardreadyops
          POSTGRES_DB: boardreadyops_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardreadyops -d boardreadyops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://boardreadyops@127.0.0.1:5432/boardreadyops_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Capture Node 22 PostgreSQL test output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pnpm --filter @boardreadyops/db db:migrate > diagnostics/migrate.txt 2>&1
          echo "$?" > diagnostics/migrate-exit.txt
          pnpm exec vitest run tests/integration/runner-lease-store-postgres.test.ts --reporter=verbose > diagnostics/test.txt 2>&1
          echo "$?" > diagnostics/test-exit.txt
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runner-lease-node22-diagnostics
          path: diagnostics
