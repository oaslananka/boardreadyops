name: pr-security-lock-refresh

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - name: Set patched dependency overrides
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'pnpm-workspace.yaml';
          let content = fs.readFileSync(path, 'utf8');
          content = content.replace("'@hono/node-server': 1.19.13", "'@hono/node-server': 2.0.10");
          if (!content.includes('  sharp: 0.35.3\n')) {
            content = content.replace("  postcss: 8.5.15\n", "  postcss: 8.5.15\n  sharp: 0.35.3\n");
          }
          fs.writeFileSync(path, content);
          NODE
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit patched lockfiles
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add pnpm-workspace.yaml pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): patch Hono adapter and sharp advisories"
          git push origin "HEAD:${HEAD_REF}"
