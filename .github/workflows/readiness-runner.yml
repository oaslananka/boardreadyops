name: BoardReadyOps Readiness Runner

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      execution_attempt_id:
        required: true
        type: string
      target:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      result_url:
        required: true
        type: string
      safe_mode:
        required: false
        type: string
        default: "false"
      safe_mode_reasons:
        required: false
        type: string
        default: ""
      setup_probe_id:
        required: false
        type: string
        default: ""
      setup_result_url:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: boardreadyops-cloud-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  readiness:
    if: ${{ inputs.setup_probe_id == '' }}
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate dispatch binding
        id: validate
        env:
          RUN_ID: ${{ inputs.run_id }}
          EXECUTION_ATTEMPT_ID: ${{ inputs.execution_attempt_id }}
          TARGET: ${{ inputs.target }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RESULT_URL: ${{ inputs.result_url }}
          CLOUD_ORIGIN: ${{ vars.BOARDREADYOPS_CLOUD_ORIGIN }}
          SAFE_MODE: ${{ inputs.safe_mode }}
          SAFE_MODE_REASONS: ${{ inputs.safe_mode_reasons }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "run_id must be a lowercase UUID" >&2
            exit 1
          fi
          if ! [[ "$EXECUTION_ATTEMPT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "execution_attempt_id must be a lowercase UUID" >&2
            exit 1
          fi
          if [ "$TARGET" != "$GITHUB_REPOSITORY" ]; then
            echo "target must match the repository that owns this workflow" >&2
            exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi

          if ! [[ "$CLOUD_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "BOARDREADYOPS_CLOUD_ORIGIN must be an HTTPS origin" >&2
            exit 1
          fi
          expected_url="${CLOUD_ORIGIN}/api/v1/runs/github-actions-result?run_id=${RUN_ID}&attempt_id=${EXECUTION_ATTEMPT_ID}"
          if [ "$RESULT_URL" != "$expected_url" ]; then
            echo "result_url must target the BoardReadyOps GitHub Actions callback for this run" >&2
            exit 1
          fi

          case "$SAFE_MODE" in
            true|false) ;;
            *)
              echo "safe_mode must be true or false" >&2
              exit 1
              ;;
          esac
          if [ "$SAFE_MODE" = "false" ] && [ -n "$SAFE_MODE_REASONS" ]; then
            echo "safe_mode_reasons requires safe_mode=true" >&2
            exit 1
          fi
          if [ "$SAFE_MODE" = "true" ]; then
            if [ -z "$SAFE_MODE_REASONS" ]; then
              echo "safe_mode=true requires at least one reason" >&2
              exit 1
            fi
            declare -A seen_reasons=()
            IFS=',' read -r -a reasons <<< "$SAFE_MODE_REASONS"
            for reason in "${reasons[@]}"; do
              case "$reason" in
                draft-pull-request|fork-pull-request|private-repository) ;;
                *)
                  echo "unsupported safe-mode reason: $reason" >&2
                  exit 1
                  ;;
              esac
              if [ -n "${seen_reasons[$reason]:-}" ]; then
                echo "duplicate safe-mode reason: $reason" >&2
                exit 1
              fi
              seen_reasons[$reason]=1
            done
          fi

      # Install pinned trusted tooling from BoardReadyOps, not from the
      # target repository's untrusted branch or default branch.
      - name: Check out trusted runner tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: oaslananka/boardreadyops
          ref: f942b9a4aa881ad0e8b868cb4922fc3e9f91652b
          path: .boardreadyops-trusted-tooling
          persist-credentials: false

      - name: Install KiCad 10
        id: kicad
        env:
          BRO_KICAD_VERSION: "10.0"
          BRO_KICAD_PPA_SERIES: "10.0"
          BRO_KICAD_INSTALL_MODE: oci
        run: |
          source .boardreadyops-trusted-tooling/scripts/install-kicad-ci.sh
          version="$(kicad-cli version)"
          case "$version" in
            10.0.*) ;;
            *)
              echo "Expected KiCad 10.0.*, got $version" >&2
              exit 1
              ;;
          esac
          if [ "${#version}" -gt 64 ] || ! [[ "$version" =~ ^10\.0\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "KiCad version is not safely reportable" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check out exact target commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Verify exact target commit
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$HEAD_SHA" ]; then
            echo "checkout SHA mismatch: expected $HEAD_SHA, got $actual_sha" >&2
            exit 1
          fi

      - name: Run BoardReadyOps
        id: readiness
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOARDREADYOPS_PR_HEAD_SHA: ${{ inputs.head_sha }}
          BOARDREADYOPS_CLOUD_RUN_ID: ${{ inputs.run_id }}
        uses: oaslananka/boardreadyops@6d3b721c3f8307a517d360b28f4d50b824d81278 # v1.24.1
        with:
          project: ${{ vars.BOARDREADYOPS_PROJECT || '' }}
          config: ${{ vars.BOARDREADYOPS_CONFIG || 'boardreadyops.yml' }}
          safe-mode: ${{ inputs.safe_mode }}
          mode: enforce
          require-kicad: "true"
          fail-on: high
          sarif: boardreadyops.sarif.json
          json: boardreadyops.findings.json
          markdown: boardreadyops.report.md
          upload-sarif: "false"
          upload-artifacts: "true"
          comment-pr: "false"

      # The readiness Action writes JSON/SARIF/Markdown into GITHUB_WORKSPACE.
      # Its completed artifact upload already retains the reports for users.
      # Move only these known untracked reports out before the manufacturing
      # exporter independently checks the entire reviewed source checkout.
      - name: Stage readiness reports outside reviewed source
        id: stage-readiness-reports
        if: always() && steps.validate.outcome == 'success' && steps.readiness.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          for name in boardreadyops.findings.json boardreadyops.sarif.json boardreadyops.report.md; do
            if [[ -e "$name" || -L "$name" ]]; then
              if [[ ! -f "$name" || -L "$name" ]] || git ls-files --error-unmatch -- "$name" > /dev/null 2>&1; then
                echo "::error::Readiness report must be an untracked regular file: $name"
                exit 1
              fi
              if [[ -e "$RUNNER_TEMP/$name" || -L "$RUNNER_TEMP/$name" ]]; then
                echo "::error::Readiness report destination already exists: $name"
                exit 1
              fi
              mv -- "$name" "$RUNNER_TEMP/$name"
            fi
          done
      # Optional source-bound manufacturing evidence. The readiness run remains
      # usable without this project setting; no delivery or share is authorized here.
      - name: Export manufacturing artifacts from the exact reviewed source
        id: manufacturing-export
        if: always() && steps.validate.outcome == 'success' && steps.kicad.outcome == 'success' && steps.stage-readiness-reports.outcome == 'success' && vars.BOARDREADYOPS_PROJECT != ''
        continue-on-error: true
        uses: oaslananka/boardreadyops/.github/actions/manufacturing-attested-export@bbdfd58631d5c8daca1179a10f74b45533903b58
        with:
          reviewed-source-sha: ${{ inputs.head_sha }}
          project: ${{ vars.BOARDREADYOPS_PROJECT }}

      - name: Install pinned GitHub attestation library
        id: manufacturing-attestation-install
        if: steps.manufacturing-export.outcome == 'success'
        continue-on-error: true
        shell: bash
        # zizmor: ignore[adhoc-packages] @actions/attest is exactly pinned for private-repository GitHub-internal Sigstore bundles; scripts are disabled.
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/attest-tools" --no-audit --no-fund --ignore-scripts --save-exact @actions/attest@3.2.0

      - name: Sign manufacturing export with GitHub-internal Sigstore
        id: manufacturing-attestation
        if: steps.manufacturing-export.outcome == 'success' && steps.manufacturing-attestation-install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SUBJECTS: ${{ steps.manufacturing-export.outputs.subject-checksums }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/attest-tools/sign-export.mjs" <<'JSCODE'
          import fs from 'node:fs';
          import { attestProvenance } from '@actions/attest';
          const pattern = /^([a-f0-9]{64})  (.+)$/u;
          const lines = fs.readFileSync(process.env.SUBJECTS, 'utf8').trimEnd().split('\n');
          const names = new Set();
          const subjects = lines.map((line) => {
            const match = pattern.exec(line);
            const name = match?.[2];
            if (
              !match ||
              !name ||
              names.has(name) ||
              name.startsWith('/') ||
              name.includes('\\') ||
              /[\r\n\0]/u.test(name) ||
              name.split('/').some((part) => !part || part === '.' || part === '..')
            ) {
              throw new Error('Unsafe manufacturing subject checksum list');
            }
            names.add(match[2]);
            return { name: match[2], digest: { sha256: match[1] } };
          });
          if (subjects.length < 5 || !subjects.some((subject) => subject.name.endsWith('/manifest.json'))) {
            throw new Error('Incomplete manufacturing subject inventory');
          }
          const result = await attestProvenance({
            subjects,
            token: process.env.GH_TOKEN,
            sigstore: 'github',
            skipWrite: true,
          });
          if (result.attestationID || result.tlogID) throw new Error('Unexpected remote attestation persistence');
          const bundlePath = process.env.RUNNER_TEMP + '/bundle.sigstore.json';
          fs.writeFileSync(bundlePath, JSON.stringify(result.bundle), { mode: 0o600 });
          const bundle = JSON.parse(fs.readFileSync(bundlePath, 'utf8'));
          if ((bundle?.verificationMaterial?.tlogEntries ?? []).length !== 0) {
            throw new Error('Unexpected public transparency log entry');
          }
          if ((bundle?.verificationMaterial?.timestampVerificationData?.rfc3161Timestamps ?? []).length === 0) {
            throw new Error('Missing signed internal timestamp');
          }
          JSCODE
          node "$RUNNER_TEMP/attest-tools/sign-export.mjs"
          tar -cf "$RUNNER_TEMP/boardreadyops-manufacturing-export.tar" \
            -C "$GITHUB_WORKSPACE" build/boardreadyops-attested
          tar -rf "$RUNNER_TEMP/boardreadyops-manufacturing-export.tar" -C "$RUNNER_TEMP" bundle.sigstore.json
          gzip -f "$RUNNER_TEMP/boardreadyops-manufacturing-export.tar"

      # The Actions upload cannot exceed the same 128 MiB archive import limit.
      - name: Check temporary signed archive size
        id: manufacturing-temporary-budget
        if: steps.manufacturing-attestation.outcome == 'success' && vars.BOARDREADYOPS_MANUFACTURING_TEMP_ARTIFACTS == 'true' && vars.BOARDREADYOPS_MANUFACTURING_OBJECT_STORAGE != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/boardreadyops-manufacturing-export.tar.gz"
          test -f "$archive" && test ! -L "$archive" && test -s "$archive"
          bytes="$(stat -c '%s' "$archive")"
          if (( bytes > 134217728 )); then
            echo "::error::Signed manufacturing archive exceeds 128 MiB import limit"
            exit 1
          fi

      # Opt-in only. This temporary download is not manufacturing approval.
      - name: Keep signed manufacturing archive temporarily in GitHub Actions
        id: manufacturing-temporary-artifact
        if: steps.manufacturing-temporary-budget.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boardreadyops-manufacturing-${{ inputs.run_id }}-${{ inputs.execution_attempt_id }}
          path: ${{ runner.temp }}/boardreadyops-manufacturing-export.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Reject conflicting manufacturing archive storage modes
        if: vars.BOARDREADYOPS_MANUFACTURING_OBJECT_STORAGE == 'true' && vars.BOARDREADYOPS_MANUFACTURING_TEMP_ARTIFACTS == 'true'
        shell: bash
        run: |
          echo "::error::Select exactly one manufacturing archive storage mode"
          exit 1

      # The GitHub runner receives only a short-lived signed PUT for pending/.
      - name: Import signed manufacturing archive via private object storage
        id: manufacturing-object-import
        if: steps.manufacturing-attestation.outcome == 'success' && vars.BOARDREADYOPS_MANUFACTURING_OBJECT_STORAGE == 'true' && vars.BOARDREADYOPS_MANUFACTURING_TEMP_ARTIFACTS != 'true'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RUN_ID: ${{ inputs.run_id }}
          EXECUTION_ATTEMPT_ID: ${{ inputs.execution_attempt_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CLOUD_ORIGIN: ${{ vars.BOARDREADYOPS_CLOUD_ORIGIN }}
        with:
          script: |
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const archive = fs.readFileSync(process.env.RUNNER_TEMP + "/boardreadyops-manufacturing-export.tar.gz");
            if (!archive.length || archive.length > 134217728) {
              throw new Error("Manufacturing archive exceeds 128 MiB");
            }
            const sha256 = crypto.createHash("sha256").update(archive).digest("hex");
            const origin = process.env.CLOUD_ORIGIN;
            if (!origin || new URL(origin).protocol !== "https:") {
              throw new Error("BoardReadyOps HTTPS cloud origin is not configured");
            }
            const endpoint = new URL(
              "/api/v1/runs/" + encodeURIComponent(process.env.RUN_ID) +
                "/attempts/" + encodeURIComponent(process.env.EXECUTION_ATTEMPT_ID) +
                "/manufacturing-export/object", origin,
            );
            const audience = "boardreadyops-manufacturing-export:" + process.env.RUN_ID + ":" +
              process.env.EXECUTION_ATTEMPT_ID + ":" + process.env.HEAD_SHA;
            const token = await core.getIDToken(audience);
            const headers = { authorization: "Bearer " + token, "content-type": "application/json" };
            const prepared = await fetch(endpoint, {
              method: "POST", headers,
              body: JSON.stringify({ operation: "prepare", sha256, bytes: archive.length }),
            });
            if (!prepared.ok) throw new Error("Object upload preparation HTTP " + prepared.status);
            const ticket = await prepared.json();
            if (
              !ticket.ok || ticket.sha256 !== sha256 || ticket.bytes !== archive.length ||
              typeof ticket.uploadId !== "string" || typeof ticket.ticket !== "string" ||
              !ticket.headers || ticket.headers["x-amz-checksum-sha256"] !== Buffer.from(sha256, "hex").toString("base64")
            ) throw new Error("Invalid source-bound object upload ticket");
            const uploadUrl = new URL(ticket.uploadUrl);
            if (uploadUrl.protocol !== "https:" || !uploadUrl.hostname.endsWith(".aws.neon.tech")) {
              throw new Error("Untrusted private manufacturing upload destination");
            }
            const uploaded = await fetch(uploadUrl, { method: "PUT", headers: ticket.headers, body: archive });
            if (!uploaded.ok) throw new Error("Private object upload HTTP " + uploaded.status);
            const committed = await fetch(endpoint, {
              method: "POST", headers,
              body: JSON.stringify({
                operation: "commit", uploadId: ticket.uploadId, sha256, bytes: archive.length,
                expiresAt: ticket.expiresAt, ticket: ticket.ticket,
              }),
            });
            if (!committed.ok) throw new Error("Private object verification HTTP " + committed.status);
            const result = await committed.json();
            if (!result.ok || result.sha256 !== sha256 || result.bytes !== archive.length) {
              throw new Error("Verified manufacturing archive integrity did not match");
            }
            core.info("Private, source-verified manufacturing archive recorded.");

      - name: Import verified manufacturing evidence into this run
        id: manufacturing-export-import
        if: steps.manufacturing-attestation.outcome == 'success' && (vars.BOARDREADYOPS_MANUFACTURING_TEMP_ARTIFACTS != 'true' || steps.manufacturing-temporary-artifact.outcome == 'success') && vars.BOARDREADYOPS_MANUFACTURING_OBJECT_STORAGE != 'true'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RUN_ID: ${{ inputs.run_id }}
          EXECUTION_ATTEMPT_ID: ${{ inputs.execution_attempt_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CLOUD_ORIGIN: ${{ vars.BOARDREADYOPS_CLOUD_ORIGIN }}
          GH_ARTIFACT_ID: ${{ steps.manufacturing-temporary-artifact.outputs.artifact-id }}
          TRUST_MODE: ${{ inputs.safe_mode == 'true' && 'safe' || 'standard' }}
          SAFE_MODE_REASONS: ${{ inputs.safe_mode_reasons }}
        with:
          script: |
            const fs = require("node:fs");
            const audience = `boardreadyops-manufacturing-export:${process.env.RUN_ID}:${process.env.EXECUTION_ATTEMPT_ID}:${process.env.HEAD_SHA}`;
            const token = await core.getIDToken(audience);
            const origin = process.env.CLOUD_ORIGIN;
            if (!origin || !origin.startsWith("https://")) throw new Error("BoardReadyOps cloud origin is not configured");
            const url = new URL(
              `/api/v1/runs/${encodeURIComponent(process.env.RUN_ID)}/attempts/${encodeURIComponent(process.env.EXECUTION_ATTEMPT_ID)}/manufacturing-export`,
              origin,
            );
            const archive = fs.readFileSync(process.env.RUNNER_TEMP + "/boardreadyops-manufacturing-export.tar.gz");
            const response = await fetch(url, {
              method: "POST",
              headers: { authorization: `Bearer ${token}`, "content-type": "application/gzip", "x-boardreadyops-github-artifact-id": process.env.GH_ARTIFACT_ID || "" },
              body: archive,
            });
            if (!response.ok) throw new Error("Signed manufacturing evidence import returned HTTP " + response.status);
            const result = await response.json();
            if (!result.ok || typeof result.artifactId !== "string") throw new Error("Signed manufacturing evidence import returned an invalid response");
            core.info("Source-bound manufacturing evidence imported and independently verified.");

      - name: Publish OIDC-authenticated cloud result
        if: always() && steps.validate.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RUN_ID: ${{ inputs.run_id }}
          EXECUTION_ATTEMPT_ID: ${{ inputs.execution_attempt_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RESULT_URL: ${{ inputs.result_url }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          KICAD_VERSION: ${{ steps.kicad.outputs.version }}
          SAFE_MODE: ${{ inputs.safe_mode }}
          SAFE_MODE_REASONS: ${{ inputs.safe_mode_reasons }}
        with:
          script: |
            const fs = require("node:fs");
            const runId = process.env.RUN_ID;
            const executionAttemptId = process.env.EXECUTION_ATTEMPT_ID;
            const targetSha = process.env.HEAD_SHA;
            const resultUrl = process.env.RESULT_URL;
            const readinessOutcome = process.env.READINESS_OUTCOME;
            const trustMode = process.env.SAFE_MODE === "true" ? "safe" : "standard";
            const safeModeReasons = process.env.SAFE_MODE_REASONS ?? "";
            const reportPath = `${process.env.RUNNER_TEMP}/boardreadyops.findings.json`;

            let report;
            try {
              report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            } catch {
              report = undefined;
            }

            const observedVersion = (value) =>
              typeof value === "string" && /^[0-9][0-9A-Za-z.+_-]{0,63}$/.test(value)
                ? value
                : undefined;
            const reportAvailable =
              report?.schemaVersion === 1 &&
              typeof report.summary === "object" &&
              report.summary !== null &&
              Array.isArray(report.findings);
            const toolVersions = {
              ...(observedVersion(process.env.KICAD_VERSION)
                ? { kicad: observedVersion(process.env.KICAD_VERSION) }
                : {}),
              ...(reportAvailable && report?.tool?.name === "boardreadyops" && observedVersion(report.tool.version)
                ? { boardReadyOps: report.tool.version }
                : {}),
            };
            const policyFailed = reportAvailable && report.summary.failed === true;
            const operationalFailure = !reportAvailable || (readinessOutcome !== "success" && !policyFailed);
            const hardwareImpact =
              reportAvailable && report.hardwareImpact && typeof report.hardwareImpact === "object"
                ? report.hardwareImpact
                : undefined;
            const rawFindings = reportAvailable ? report.findings : [];
            const severity = (value) => value === "critical" ? "error" :
              ["error", "high", "medium", "low", "info"].includes(value) ? value : "error";
            const boundedText = (value, fallback, maximum) => {
              const normalized = String(value ?? fallback).trim() || fallback;
              return normalized.slice(0, maximum);
            };
            const finiteMetric = (value, fallback = 0) => {
              const numeric = Number(value);
              return Number.isFinite(numeric) ? numeric : fallback;
            };
            const findings = rawFindings.slice(0, 500).map((finding) => ({
              ruleId: boundedText(finding.ruleId, "boardreadyops.unknown", 256),
              severity: severity(finding.severity),
              message: boundedText(finding.message, "BoardReadyOps reported an unspecified finding.", 4000),
              ...(typeof finding.resource?.path === "string" && finding.resource.path.trim().length > 0
                ? { path: boundedText(finding.resource.path, "unknown", 1024) }
                : {}),
            }));
            const rawBoms = reportAvailable && Array.isArray(report.boms) ? report.boms : [];
            const componentText = (value, maximum) => {
              const normalized = String(value ?? "").trim();
              return normalized.length > 0 ? normalized.slice(0, maximum) : undefined;
            };
            const positiveCount = (value) => {
              const numeric = Number(value);
              return Number.isSafeInteger(numeric) && numeric > 0 && numeric <= 1000000 ? numeric : undefined;
            };
            const releaseMode = (value) =>
              value === "prototype" || value === "pilot" || value === "production" ? value : undefined;
            const defined = (entries) => Object.fromEntries(entries.filter(([, value]) => value !== undefined));
            const boms = rawBoms
              .filter((bom) => typeof bom?.project === "string" && Array.isArray(bom.components))
              .slice(0, 50)
              .map((bom) => {
                const parsedReleaseMode = releaseMode(bom.releaseMode);
                return {
                  project: boundedText(bom.project, "unknown.kicad_pro", 1024),
                  ...(parsedReleaseMode ? { releaseMode: parsedReleaseMode } : {}),
                  components: bom.components
                    .filter((component) => componentText(component?.reference, 64) !== undefined)
                    .slice(0, 5000)
                    .map((component) =>
                      defined([
                        ["reference", componentText(component.reference, 64)],
                        ["mpn", componentText(component.mpn, 128)],
                        ["manufacturer", componentText(component.manufacturer, 128)],
                        ["value", componentText(component.value, 256)],
                        ["footprint", componentText(component.footprint, 256)],
                        ["quantity", positiveCount(component.quantity)],
                        ["dnp", typeof component.dnp === "boolean" ? component.dnp : undefined],
                        ["lifecycle", componentText(component.lifecycle, 64)],
                        [
                          "identityKey",
                          /^[0-9a-f]{16}$/.test(String(component.identityKey ?? ""))
                            ? String(component.identityKey)
                            : undefined,
                        ],
                      ]),
                    ),
                };
              });
            const summary = reportAvailable ? report.summary : {};
            const actionsRunUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const reportLinks = actionsRunUrl.startsWith("https://")
              ? [{ label: "GitHub Actions run", url: actionsRunUrl.slice(0, 2048) }]
              : [];
            const payload = {
              version: 1,
              executionAttemptId,
              status: operationalFailure ? "failed" : "completed",
              conclusion: operationalFailure || policyFailed ? "failure" : "success",
              decision: operationalFailure ? "error" : policyFailed ? "fail" : "pass",
              findings,
              artifacts: [],
              metrics: {
                findings_total: finiteMetric(summary.total, findings.length),
                findings_critical: finiteMetric(summary.critical),
                findings_high: finiteMetric(summary.high),
                findings_medium: finiteMetric(summary.medium),
                findings_low: finiteMetric(summary.low),
                findings_info: finiteMetric(summary.info),
              },
              reportLinks,
              ...(Object.keys(toolVersions).length > 0 ? { toolVersions } : {}),
              ...(hardwareImpact ? { hardwareImpact } : {}),
              ...(boms.length > 0 ? { boms } : {}),
            };
            const payloadTooLarge = () => Buffer.byteLength(JSON.stringify(payload), "utf8") > 900 * 1024;
            // Bound the transmitted component count before measuring. The contract permits
            // 50 boards of 5000 components, which serialises far past the transmit budget;
            // trimming up front keeps the size checks below to a few dozen serialisations
            // instead of one per dropped component.
            let componentBudget = 20000;
            for (const bom of boms) {
              if (bom.components.length > componentBudget) bom.components = bom.components.slice(0, componentBudget);
              componentBudget -= bom.components.length;
            }
            // Shed BOM rows before findings: a finding is a decision input for this release,
            // while a BOM row is supplementary evidence that the next run re-reports. Whole
            // boards are dropped so this terminates in at most one pass per board.
            while (payloadTooLarge() && boms.length > 0) {
              boms.pop();
            }
            if (boms.length === 0) delete payload.boms;
            while (payloadTooLarge() && findings.length > 0) {
              findings.pop();
            }
            payload.metrics.findings_transmitted = findings.length;
            payload.metrics.boms_transmitted = boms.length;

            const audience = `boardreadyops-cloud:${runId}:${executionAttemptId}:${targetSha}:${trustMode}:${safeModeReasons || "none"}`;
            const oidcToken = await core.getIDToken(audience);
            // Keep the OIDC identity and all decision-bearing fields unchanged on retry.
            const sendResult = () =>
              fetch(resultUrl, {
                method: "POST",
                headers: {
                  authorization: `Bearer ${oidcToken}`,
                  "content-type": "application/json",
                  "x-boardreadyops-trust-mode": trustMode,
                  "x-boardreadyops-safe-mode-reasons": safeModeReasons,
                },
                body: JSON.stringify(payload),
              });
            // A 2xx proxy page is not a persisted signed result for this exact run.
            const acknowledgedResult = async (response) => {
              if (!response?.ok) return false;
              let receipt;
              try {
                receipt = await response.clone().json();
              } catch {
                return false;
              }
              return (
                receipt !== null &&
                typeof receipt === "object" &&
                !Array.isArray(receipt) &&
                receipt.ok === true &&
                (receipt.status === "accepted" || receipt.status === "replayed") &&
                receipt.runId === runId &&
                receipt.executionAttemptId === executionAttemptId &&
                receipt.checkRunUpdated === true
              );
            };
            let response;
            let acceptedReceipt = false;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              response = await sendResult();
              acceptedReceipt = await acknowledgedResult(response);
              if (acceptedReceipt) break;
              // During a rolling upgrade, an older strict v1 receiver does not know
              // the optional toolVersions field. Retry once without that field only
              // for its exact 400 validation error, never for authorization failures.
              if (response.status === 400 && Object.hasOwn(payload, "toolVersions")) {
                let legacyValidationError = false;
                try {
                  const rejection = await response.clone().json();
                  legacyValidationError =
                    rejection !== null &&
                    typeof rejection === "object" &&
                    !Array.isArray(rejection) &&
                    Object.keys(rejection).length === 1 &&
                    rejection.error === "invalid runner result";
                } catch {
                  // An unexpected response is never evidence of v1 incompatibility.
                }
                if (legacyValidationError) {
                  delete payload.toolVersions;
                  response = await sendResult();
                  acceptedReceipt = await acknowledgedResult(response);
                  if (acceptedReceipt) break;
                }
              }
              if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
            }
            if (!acceptedReceipt) {
              if (response?.ok) {
                throw new Error("BoardReadyOps Cloud callback did not confirm the persisted result and Check Run.");
              }
              const responseText = response ? (await response.text()).slice(0, 512) : "no response";
              throw new Error(`BoardReadyOps Cloud callback failed: HTTP ${response?.status ?? "unknown"}: ${responseText}`);
            }
            if (operationalFailure || policyFailed) {
              core.setFailed(policyFailed ? "BoardReadyOps found blocking readiness findings." : "BoardReadyOps execution failed or did not produce a valid report.");
            }

  setup-probe:
    if: ${{ inputs.setup_probe_id != '' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate setup probe binding
        id: validate
        env:
          SETUP_PROBE_ID: ${{ inputs.setup_probe_id }}
          SETUP_RESULT_URL: ${{ inputs.setup_result_url }}
          TARGET: ${{ inputs.target }}
          CLOUD_ORIGIN: ${{ vars.BOARDREADYOPS_CLOUD_ORIGIN }}
        run: |
          if ! [[ "$SETUP_PROBE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "setup_probe_id must be a lowercase UUID" >&2
            exit 1
          fi
          if [ "$TARGET" != "$GITHUB_REPOSITORY" ]; then
            echo "target must match the repository that owns this workflow" >&2
            exit 1
          fi
          if ! [[ "$CLOUD_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "BOARDREADYOPS_CLOUD_ORIGIN must be an HTTPS origin" >&2
            exit 1
          fi
          expected_url="${CLOUD_ORIGIN}/api/v1/setup-probes/result?probe_id=${SETUP_PROBE_ID}"
          if [ "$SETUP_RESULT_URL" != "$expected_url" ]; then
            echo "setup_result_url must target the BoardReadyOps setup callback for this probe" >&2
            exit 1
          fi

      # The setup probe validates one tracked config file, not the PCB source tree.
      # A malformed, unrelated gitlink must not prevent that configuration check.
      - name: Read configuration from authenticated GitHub commit
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CONFIG_PATH: ${{ vars.BOARDREADYOPS_CONFIG || 'boardreadyops.yml' }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const configPath = String(process.env.CONFIG_PATH ?? "").trim();
            const segments = configPath.split("/");
            if (
              !configPath ||
              configPath.length > 256 ||
              configPath.startsWith("/") ||
              configPath.includes("\\") ||
              /[\x00-\x1f\x7f]/u.test(configPath) ||
              segments.length > 16 ||
              segments.some((segment) => !segment || segment === "." || segment === "..")
            ) {
              throw new Error("CONFIG_PATH must be a normalized repository-relative file path");
            }
            const { owner, repo } = context.repo;
            const observedSha = context.sha;
            if (!/^[a-f0-9]{40}$/u.test(observedSha) || !/^refs\/heads\//u.test(context.ref)) {
              throw new Error("Setup probe requires a verified branch commit");
            }
            const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: observedSha });
            let treeSha = commit.data.tree.sha;
            let file;
            for (const [index, segment] of segments.entries()) {
              const response = await github.rest.git.getTree({ owner, repo, tree_sha: treeSha });
              const entry = response.data.tree.find((item) => item.path === segment);
              if (!entry) break;
              if (index === segments.length - 1) {
                if (entry.type !== "blob" || !["100644", "100755"].includes(entry.mode)) {
                  throw new Error("CONFIG_PATH must be a tracked regular file, not a symlink or gitlink");
                }
                if (!Number.isSafeInteger(entry.size) || entry.size > 65536) {
                  throw new Error("Repository configuration exceeds the 64 KiB setup probe limit");
                }
                file = entry;
              } else {
                if (entry.type !== "tree" || entry.mode !== "040000") {
                  throw new Error("CONFIG_PATH parent must be a tracked directory");
                }
                treeSha = entry.sha;
              }
            }
            if (file) {
              const response = await github.rest.git.getBlob({ owner, repo, file_sha: file.sha });
              const blob = response.data;
              const base64 = String(blob.content ?? "").replace(/\s/gu, "");
              if (
                blob.encoding !== "base64" ||
                !Number.isSafeInteger(blob.size) ||
                blob.size > 65536 ||
                !/^[A-Za-z0-9+/]*={0,2}$/u.test(base64)
              ) {
                throw new Error("Invalid GitHub configuration blob");
              }
              const bytes = Buffer.from(base64, "base64");
              if (bytes.length !== blob.size || bytes.length !== file.size || bytes.toString("base64") !== base64) {
                throw new Error("GitHub configuration blob size or encoding does not match the commit tree");
              }
              const destination = path.join(process.env.RUNNER_TEMP, "boardreadyops-setup-probe");
              fs.mkdirSync(destination, { recursive: true, mode: 0o700 });
              fs.writeFileSync(path.join(destination, "boardreadyops.yml"), bytes, { flag: "wx", mode: 0o600 });
            }
            core.setOutput("observed_sha", observedSha);
            core.setOutput("config_status", file ? "found" : "missing");

      - name: Check out verified BoardReadyOps release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: oaslananka/boardreadyops
          ref: ce925376bd71daf7e07f31fb1bb19a8bde30b172 # v1.24.1
          path: .boardreadyops-tool
          persist-credentials: false
          sparse-checkout: |
            dist/cli/index.cjs
            package.json
          sparse-checkout-cone-mode: false

      - name: Validate BoardReadyOps configuration
        id: inspect
        env:
          BOARDREADYOPS_LOCALE: en
          OBSERVED_SHA: ${{ steps.source.outputs.observed_sha }}
          SOURCE_STATUS: ${{ steps.source.outputs.config_status }}
        run: |
          observed_sha="$OBSERVED_SHA"
          if ! [[ "$observed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub source inspection did not resolve a full commit SHA" >&2
            exit 1
          fi

          tool_version="$(node "$GITHUB_WORKSPACE/.boardreadyops-tool/dist/cli/index.cjs" --version)"
          if [ "$tool_version" != "1.24.1" ]; then
            echo "verified BoardReadyOps checkout returned unexpected version: $tool_version" >&2
            exit 1
          fi

          OBSERVED_SHA="$observed_sha" TOOL_VERSION="$tool_version" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const observedSha = process.env.OBSERVED_SHA;
          const toolVersion = process.env.TOOL_VERSION;
          const status = process.env.SOURCE_STATUS;
          if (status === "missing") {
            fs.writeFileSync("setup-result.json", JSON.stringify({
              contractVersion: 1,
              configStatus: "missing",
              observedSha,
              toolVersion,
              diagnostics: ["The configured BoardReadyOps path is missing at the verified branch commit."],
            }));
            process.exit(0);
          }
          if (status !== "found") {
            throw new Error("GitHub source inspection did not confirm a configuration file");
          }
          const candidate = path.join(process.env.RUNNER_TEMP, "boardreadyops-setup-probe", "boardreadyops.yml");
          const metadata = fs.lstatSync(candidate);
          if (metadata.isSymbolicLink() || !metadata.isFile() || metadata.size > 65536) {
            throw new Error("Verified repository configuration was not staged as a regular bounded file");
          }
          NODE

          if [ -f setup-result.json ]; then
            exit 0
          fi

          (
            cd "$RUNNER_TEMP/boardreadyops-setup-probe"
            node "$GITHUB_WORKSPACE/.boardreadyops-tool/dist/cli/index.cjs" doctor --check repository --format json > "$GITHUB_WORKSPACE/doctor.json"
          )
          OBSERVED_SHA="$observed_sha" TOOL_VERSION="$tool_version" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("doctor.json", "utf8"));
          const reportToolVersion = String(report?.tool?.version ?? "").trim();
          if (reportToolVersion !== process.env.TOOL_VERSION) {
            throw new Error("BoardReadyOps doctor reported an unexpected tool version");
          }
          const repository = report?.checks?.find((check) => check?.name === "repository");
          const configItem = repository?.items?.find((item) =>
            typeof item?.message === "string" &&
            (item.message.includes("found and valid") || item.message.includes("configuration is invalid"))
          );
          const configStatus = configItem?.severity === "pass" ? "ready" : "invalid";
          const diagnostics = configStatus === "ready"
            ? []
            : [String(configItem?.message ?? "BoardReadyOps could not validate the configuration.").slice(0, 512)];
          fs.writeFileSync("setup-result.json", JSON.stringify({
            contractVersion: 1,
            configStatus,
            configVersion: configStatus === "ready" ? 1 : undefined,
            observedSha: process.env.OBSERVED_SHA,
            toolVersion: reportToolVersion,
            diagnostics,
          }));
          NODE

      - name: Publish OIDC-authenticated setup result
        if: always() && steps.validate.outcome == 'success' && steps.inspect.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SETUP_PROBE_ID: ${{ inputs.setup_probe_id }}
          SETUP_RESULT_URL: ${{ inputs.setup_result_url }}
        with:
          script: |
            const fs = require("node:fs");
            const probeId = process.env.SETUP_PROBE_ID;
            const resultUrl = process.env.SETUP_RESULT_URL;
            const payload = JSON.parse(fs.readFileSync("setup-result.json", "utf8"));
            const oidcToken = await core.getIDToken(`boardreadyops-setup:${probeId}`);
            let response;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              response = await fetch(resultUrl, {
                method: "POST",
                headers: {
                  authorization: `Bearer ${oidcToken}`,
                  "content-type": "application/json",
                },
                body: JSON.stringify(payload),
              });
              if (response.ok) break;
              if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
            }
            if (!response?.ok) {
              const responseText = response ? (await response.text()).slice(0, 512) : "no response";
              throw new Error(`BoardReadyOps setup callback failed: HTTP ${response?.status ?? "unknown"}: ${responseText}`);
            }
