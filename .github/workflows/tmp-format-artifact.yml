name: tmp-format-artifact

on:
  pull_request:
    branches:
      - feat/runner-routing-policy

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/format-runner-routing-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Apply and verify repository formatter
        run: |
          set -euo pipefail
          pnpm run lint:fix
          pnpm run lint
      - name: Commit formatted feature files and remove finalizer
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-format-artifact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/integration/runner-routing-policy-postgres.test.ts .github/workflows/tmp-format-artifact.yml
          git diff --cached --quiet && { echo 'No formatting changes to commit.'; exit 1; }
          git commit -m "style(test): format runner routing policy coverage"
          git push origin HEAD:${{ github.head_ref }}
