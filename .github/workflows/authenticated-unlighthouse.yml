name: Authenticated UI audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-ui-audit
  cancel-in-progress: false

env:
  NODE_VERSION: "24.20.0"

jobs:
  audit:
    name: authenticated-ui / unlighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROPS_SESSION: ${{ secrets.BROPS_UNLIGHTHOUSE_SESSION }}
      BROPS_UNLIGHTHOUSE_SITE: https://boardreadyops.com
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - run: corepack pnpm run deps:install-ci
      - name: Require ephemeral authenticated session
        shell: bash
        run: |
          if [ -z "${BROPS_SESSION:-}" ]; then
            echo "::error::BROPS_UNLIGHTHOUSE_SESSION repository secret is required"
            exit 1
          fi
      - name: Verify installed Chrome
        shell: bash
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            echo "::error::GitHub runner does not provide Chrome"
            exit 1
          fi
      - name: Audit authenticated product routes
        run: corepack pnpm run qa:unlighthouse:auth
      - name: Upload authenticated audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authenticated-unlighthouse-${{ github.run_id }}
          path: |
            .unlighthouse/authenticated/
            .unlighthouse/authenticated-routes.json
          retention-days: 7
          if-no-files-found: ignore
