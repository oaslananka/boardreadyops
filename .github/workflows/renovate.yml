name: renovate-config-validate

on:
  pull_request:
    paths:
      - renovate.json
      - package.json
      - scripts/validate-renovate-config.mjs
      - .github/workflows/renovate.yml
      - docs/dependency-automation.md
      - .github/workflows/renovate-generated.yml
      - scripts/renovate-generated-artifacts.mjs
      - tests/unit/scripts/security-automation-config.test.ts
  push:
    branches: [main]
    paths:
      - renovate.json
      - package.json
      - scripts/validate-renovate-config.mjs
      - .github/workflows/renovate.yml
      - docs/dependency-automation.md
      - .github/workflows/renovate-generated.yml
      - scripts/renovate-generated-artifacts.mjs
      - tests/unit/scripts/security-automation-config.test.ts

# The installed Mend Renovate App is the sole dependency-update writer.
# This workflow validates configuration only; it never creates update PRs.

permissions:
  contents: read

concurrency:
  group: renovate-validate-${{ github.ref }}
  cancel-in-progress: true


jobs:
  validate:
    name: renovate / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: corepack enable
      - run: node scripts/toolchain.mjs corepack-install
      - name: Validate Renovate configuration
        run: pnpm run renovate:validate
