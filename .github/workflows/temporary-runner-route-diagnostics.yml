name: temporary-runner-route-diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.repository_owner == 'oaslananka' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic route fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path("apps/web/lib/runner-request-auth.ts")
          auth_text = auth.read_text()
          auth_text = auth_text.replace(
              "return Number.isSafeInteger(parsed) ? parsed : undefined;",
              "return Number.isSafeInteger(parsed) && String(parsed) === value ? parsed : undefined;",
          )
          auth.write_text(auth_text)

          test = Path("tests/unit/web/runner-lease-routes.test.ts")
          test_text = test.read_text().replace(
              'from "@boardreadyops/cloud-core";',
              'from "../../../packages/cloud-core/src/runner-request-signature.js";',
          )
          test.write_text(test_text)
          PY
          pnpm exec biome check --write \
            apps/web/lib/runner-request-auth.ts \
            apps/web/lib/runner-lease-routes.ts \
            apps/web/app/api/v1/runner/jobs/claim/route.ts \
            apps/web/app/api/v1/runner/leases/heartbeat/route.ts \
            apps/web/app/api/v1/runner/leases/relinquish/route.ts \
            tests/unit/web/runner-lease-routes.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/lib/runner-request-auth.ts \
            apps/web/lib/runner-lease-routes.ts \
            apps/web/app/api/v1/runner/jobs/claim/route.ts \
            apps/web/app/api/v1/runner/leases/heartbeat/route.ts \
            apps/web/app/api/v1/runner/leases/relinquish/route.ts \
            tests/unit/web/runner-lease-routes.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(runner): format signed route slice"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
