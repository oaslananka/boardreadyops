name: temporary-terminal-result-route-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.repository_owner == 'oaslananka' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Patch verified result core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("apps/web/app/api/v1/runs/result/route.ts")
          text = target.read_text()

          if "authenticationVerified?: boolean" not in text:
            text, count = re.subn(
              r'(  verifyOidcToken: \(token: string, runId: string, executionAttemptId: string \| undefined\) => Promise<boolean>;\n)(};)',
              r'\1  authenticationVerified?: boolean;\n  verifiedLeaseId?: string;\n\2',
              text,
              count=1,
            )
            if count != 1:
              raise SystemExit("dependency type marker not found")

          if "export const defaultResultRouteDependencies" not in text:
            text = text.replace(
              "const defaultDependencies: ResultRouteDependencies = {",
              "export const defaultResultRouteDependencies: ResultRouteDependencies = {",
              1,
            )
          text = text.replace(
            "dependencies: ResultRouteDependencies = defaultDependencies,",
            "dependencies: ResultRouteDependencies = defaultResultRouteDependencies,",
            1,
          )

          if "!dependencies.authenticationVerified &&" not in text:
            text, count = re.subn(
              r'(  if \(\n)(    !\(await verifyRunnerAuthentication\()',
              r'\1    !dependencies.authenticationVerified &&\n\2',
              text,
              count=1,
            )
            if count != 1:
              raise SystemExit("authentication marker not found")

          if "completed_lease as (" not in text:
            completed_lease = '''     completed_lease as (
               update runner_job_leases
               set status = 'completed',
                   stage = 'reporting',
                   heartbeat_at = greatest(runner_job_leases.heartbeat_at, $5::timestamptz),
                   closed_at = coalesce(runner_job_leases.closed_at, $5::timestamptz),
                   close_reason = coalesce(runner_job_leases.close_reason, 'Terminal result accepted.')
               from updated
               where $15::text is not null
                 and $3 in ('completed', 'failed', 'timed_out')
                 and runner_job_leases.id = $15
                 and runner_job_leases.run_id = updated.id
                 and runner_job_leases.execution_attempt_id = $2
                 and runner_job_leases.status = 'active'
               returning runner_job_leases.id
             ),
          '''
            match = re.search(r'\n\s+deleted_findings as \(\n', text)
            if not match:
              raise SystemExit("completed lease insertion marker not found")
            start, end = match.span()
            original = match.group(0)
            text = text[:start] + "\n" + completed_lease + original[1:] + text[end:]

          if "'leaseCompleted'" not in text:
            text, count = re.subn(
              r"('attemptUpdated', exists\(select 1 from updated_attempt\),\n\s*)('findingCount')",
              r"\1'leaseCompleted', exists(select 1 from completed_lease),\n                 \2",
              text,
              count=1,
            )
            if count != 1:
              raise SystemExit("audit metadata marker not found")

          if "dependencies.verifiedLeaseId ?? null" not in text:
            text, count = re.subn(
              r'(\n\s+artifactsJson,\n)(\s+\],\n\s+\);)',
              r'\1      dependencies.verifiedLeaseId ?? null,\n\2',
              text,
              count=1,
            )
            if count != 1:
              raise SystemExit("SQL parameter marker not found")

          target.write_text(text)
          PY
          pnpm exec biome check --write \
            apps/web/app/api/v1/runs/result/route.ts \
            apps/web/lib/runner-terminal-result-routes.ts \
            apps/web/app/api/v1/runner/results/route.ts \
            tests/unit/web/runner-terminal-result-route.test.ts
          pnpm run typecheck
          pnpm exec vitest run \
            tests/unit/web/readiness-result-route.test.ts \
            tests/unit/web/runner-terminal-result-route.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/api/v1/runs/result/route.ts \
            apps/web/lib/runner-terminal-result-routes.ts \
            apps/web/app/api/v1/runner/results/route.ts \
            tests/unit/web/runner-terminal-result-route.test.ts
          git commit -m "feat(runner): integrate signed terminal results"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
