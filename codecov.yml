comment:
  behavior: default
  layout: header, reach, diff, flags, components, footer
  require_changes: false
  show_carryforward_flags: true
  require_base: false

coverage:
  precision: 2
  round: down
  range: 70..100
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        flags:
          - core
          - cloud
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
        flags:
          - core
          - cloud
    changes: false

flags:
  core:
    paths:
      - src/
    carryforward: true
  cloud:
    paths:
      - apps/web/
      - packages/cloud-core/
      - packages/contracts/
      - packages/db/
    carryforward: true

component_management:
  individual_components:
    - component_id: core_engine
      name: Core engine
      paths:
        - src/core/**
    - component_id: rules
      name: Rules
      paths:
        - src/rules/**
    - component_id: bom_supply_chain
      name: BOM and supply chain
      paths:
        - src/bom/**
    - component_id: pinmap_contracts
      name: Pinmap contracts
      paths:
        - src/pinmap/**
    - component_id: kicad_integration
      name: KiCad integration
      paths:
        - src/kicad/**
    - component_id: reporting_notifications
      name: Reporting and notifications
      paths:
        - src/report/**
        - src/notifiers/**
    - component_id: action_inputs
      name: GitHub Action inputs
      paths:
        - src/action/inputs.ts
    - component_id: cloud_control_plane
      name: Cloud control plane
      paths:
        - packages/cloud-core/**
        - packages/contracts/**
        - packages/db/**
    - component_id: hosted_web
      name: Hosted web application
      paths:
        - apps/web/**

bundle_analysis:
  warning_threshold: "5%"
  status: informational

ignore:
  - "dist/**/*"
