minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@renovatebot/osv-offline-db@3.0.9'
  - '@renovatebot/osv-offline@3.0.9'
  - '@hono/node-server@2.0.12'
  - 'brace-expansion@5.0.9'
  # GitHub advisory GHSA-ggr8-5vv4-36mx: first patched deepmerge-ts release
  - 'deepmerge-ts@8.0.0'
  # Renovate security update: js-yaml@4.3.1
  - 'js-yaml@5.2.2 || 4.3.1'
  # OSV security update: nanoid@3.3.17 || 3.3.18
  - 'nanoid@3.3.17 || 3.3.18'
  - 'hono@4.12.34'
  - 'ip-address@10.3.1'
  - 'undici@8.9.0'
  - 'valibot@1.4.2'
  # Renovate security update: fast-uri@3.1.6
  - 'fast-uri@3.1.5 || 3.1.6'
  - 'renovate@43.272.4'
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@yarnpkg/libzip@3.2.2'
  - 'semver@6.3.1'
blockExoticSubdeps: true

packages:
  - .
  - packages/*
  - apps/*
  - examples/plugin-*

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': false
  esbuild: true
  libxmljs2: false
  prisma: true
  puppeteer: false
  sharp: true
  vue-demi: false

overrides:
  'archiver>readdir-glob': 3.0.0
  browserslist@<=4.28.6: 4.28.7
  '@prisma/config>deepmerge-ts': 8.0.0
  'pa11y>puppeteer': 25.8.0
  'fontless>esbuild': 0.28.2
