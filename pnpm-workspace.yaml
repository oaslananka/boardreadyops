minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@renovatebot/osv-offline-db@3.0.9'
  - '@renovatebot/osv-offline@3.0.9'
  - '@hono/node-server@2.0.12'
  # GitHub advisory GHSA-ggr8-5vv4-36mx: first patched deepmerge-ts release
  - 'deepmerge-ts@8.0.0'
  # OSV security update: js-yaml@4.3.2
  - 'js-yaml@5.2.2 || 4.3.2'
  # OSV security update: nanoid@3.3.17 || 3.3.18
  - 'nanoid@3.3.17 || 3.3.18'
  # OSV security update: hono@4.13.7
  - 'hono@4.13.7'
  # OSV security update: GHSA-vfgh-jcmw-g37q patched markdown-it@14.3.3
  - 'markdown-it@14.3.3'
  - 'smol-toml@1.9.0'
  - 'valibot@1.4.2'
  # Security fixes; review/remove exceptions after the minimum release age.
  - 'sharp@0.35.5'
  - 'proxy-addr@2.0.8'
  - 'source-map-js@1.2.2'
  - '@modelcontextprotocol/sdk@1.32.0'
  - 'vite@8.2.4'
  # Security advisory fixes from latest OSV scan. Review exclusions after normal age window.
  - 'fast-uri@3.1.9'
  - 'body-parser@2.4.0'
  - 'undici@6.29.1'
  - 'zod@4.6.6'
  - 'happy-dom@21.0.4'
  - 'qs@6.16.0'
  - 'renovate@43.272.4'
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@yarnpkg/libzip@3.2.2'
  - 'semver@6.3.1'
blockExoticSubdeps: true

packages:
  - .
  - packages/*
  - apps/*
  - examples/plugin-*

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': false
  esbuild: true
  libxmljs2: false
  prisma: true
  puppeteer: false
  sharp: true
  vue-demi: false

# Upstream chromium-bidi v17 still references Zod 3's removed ZodError.errors alias.
# Retain invalid-command protocol errors when running against the patched Zod 4.
patchedDependencies:
  chromium-bidi@17.0.2: patches/chromium-bidi@17.0.2.patch

overrides:
  # Bound JSON.parse fallback matching to the upstream ReDoS fix (#1036).
  json-with-bigint: 3.5.12
  'archiver>readdir-glob': 3.0.0
  browserslist@<=4.28.6: 4.28.9
  '@prisma/config>deepmerge-ts': 8.0.2
  'pa11y>puppeteer': 25.8.0
  'fontless>esbuild': 0.28.2
  '@hono/node-server@<2.0.12': 2.0.12
  'postcss@<8.5.23': 8.5.26
  sharp: 0.35.5
  '@modelcontextprotocol/sdk@<1.32.0': 1.32.0
  'proxy-addr@<2.0.8': 2.0.8
  'source-map-js@<1.2.2': 1.2.2
  '@octokit/plugin-paginate-rest@>=1.0.0 <9.2.2': '>=9.2.2'
  '@octokit/request-error@>=1.0.0 <5.1.1': '>=5.1.1'
  '@octokit/request@>=1.0.0 <8.4.1': '>=8.4.1'
  diff@>=6.0.0 <8.0.3: '>=8.0.3'
  esbuild@<=0.24.2: '>=0.25.0'
  glob@>=10.0.0 <13.0.6: 13.0.6
  'qs@>=6.11.1 <6.16.0': 6.16.0
  'undici@>=8.0.0 <8.11.0': 8.11.2
  'undici@>=6 <6.29.1': 6.29.1
  vite@<=6.4.1: '>=6.4.2'
  vite@^8.0.0: '8.2.4'
  '@babel/core@>=7.0.0 <7.29.1': '>=7.29.1'
  'brace-expansion@>=5 <5.0.12': 5.0.12
  'fast-uri@>=3 <3.1.9': 3.1.9
  'hono@<4.13.7': 4.13.13
  'body-parser@>=2 <2.4.0': 2.4.0
  # Explicit compatibility probes required: both upstream tools still declare Zod 3.
  '@codecov/bundler-plugin-core>zod': 4.6.6
  'chromium-bidi>zod': 4.6.6
  'markdown-it@<14.3.3': 14.3.3
  'next@<16.4.1': 16.4.1
  'smol-toml@<1.9.0': 1.9.0
  'ip-address@<10.7.4': 10.7.4
  'nanoid@<3.3.17': 3.3.20
  js-yaml@>=4 <4.3.2: 4.3.2
  linkify-it@>=5 <5.0.2: 5.0.2
  mysql2@<3.23.1: 3.23.4
  valibot: 1.4.2
  ws@>=8 <8.21.1: 8.21.3
