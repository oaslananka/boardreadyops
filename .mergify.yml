# Mergify is intentionally limited to free-plan pull-request labelling.
# Merge eligibility, required checks, update policy, and squash enforcement live in
# the GitHub `main` ruleset. Do not add Mergify merge_queue, queue_rules, scopes,
# or queue actions here: those couple normal pull requests to paid Merge Queue features.

pull_request_rules:
  # Security workflow changes require manual attention.
  - name: label security workflow changes
    conditions:
      - files ~= ^\.github/workflows/security
    actions:
      label:
        add:
          - security
          - manual-review

  # Automatically classify documentation-only changes.
  #
  # Rule documentation under docs/rules/ is generated by scripts/generate-rule-docs.mjs,
  # so code changes can touch docs/ as a side effect. Keep this strictly docs-only.
  - name: label documentation changes
    conditions:
      - files ~= ^docs/
      - -files ~= ^src/
      - -files ~= ^packages/
      - -files ~= ^apps/
      - -files ~= ^tests/
      - -files ~= ^scripts/
    actions:
      label:
        add:
          - documentation
