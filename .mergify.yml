# Mergify provides pull-request classification plus a manual-only merge queue.
#
# Merge eligibility, required checks, review-thread resolution, update policy, and squash
# enforcement remain authoritative in the GitHub main ruleset. Mergify auto-merge is
# intentionally disabled: a maintainer must explicitly enqueue a PR with
# @mergifyio queue main (or the equivalent Mergify queue control).

# In-place serial checks preserve the GitHub main ruleset requirement that
# every PR must be up to date before merge; no ruleset bypass is needed.
merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: main
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = main
      - -draft

pull_request_rules:
  # Security workflow changes require manual attention.
  - name: label security workflow changes
    conditions:
      - files ~= ^\.github/workflows/security
    actions:
      label:
        add:
          - security
          - manual-review

  # Automatically classify documentation-only changes.
  #
  # Rule documentation under docs/rules/ is generated by scripts/generate-rule-docs.mjs,
  # so code changes can touch docs/ as a side effect. Keep this strictly docs-only.
  - name: label documentation changes
    conditions:
      - files ~= ^docs/
      - -files ~= ^src/
      - -files ~= ^packages/
      - -files ~= ^apps/
      - -files ~= ^tests/
      - -files ~= ^scripts/
    actions:
      label:
        add:
          - documentation
