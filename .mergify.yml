# Merge Queue remains maintainer-controlled.
# A PR enters the queue only after a maintainer explicitly applies the
# `queue-me` label. Automation must never add that label.
#
# GitHub repository rulesets are the authoritative merge gate.
# Required GitHub status checks are NOT duplicated here.
# Mergify reads and injects the applicable GitHub ruleset requirements.

merge_queue:
  # Process queued PRs serially.
  mode: serial

  # One validation at a time.
  # Together with batch_size: 1 and max_checks_retries: 0,
  # this keeps the queue eligible for in-place checks.
  max_parallel_checks: 1

  # Only report final queue outcomes.
  status_comments: outcomes

  # If main changes outside Mergify, re-evaluate the queue.
  reset_on_external_merge: always

  # Avoid unnecessary intermediate queue results.
  skip_intermediate_results: true

  # Queue admission is controlled exclusively by the `queue-me` label.
  queue_controls_comment: false


# File scopes are used by Mergify for change-area awareness.
# BoardReadyOps CI remains responsible for its own risk-profile routing.
scopes:
  source:
    files:
      cli:
        include:
          - "src/cli/**/*"

      core:
        include:
          - "src/**/*"
          - "packages/cloud-core/**/*"
          - "packages/db/**/*"

      web:
        include:
          - "apps/web/**/*"
          - "packages/db/**/*"

      repository:
        include:
          - ".github/**/*"
          - "scripts/**/*"
          - "package.json"
          - "pnpm-lock.yaml"
          - "renovate.json"

  merge_queue_scope: merge-queue


queue_rules:
  - name: default

    # Only one PR is validated/merged at a time.
    batch_size: 1

    # Explicitly let Mergify import the GitHub branch/ruleset protections.
    #
    # With `queue`:
    # - GitHub ruleset requirements are checked before queue admission.
    # - They are checked again before the final merge.
    #
    # This keeps GitHub Rulesets as the source of truth and avoids
    # duplicating every required check in this file.
    branch_protection_injection_mode: queue

    # When a queued PR is behind main, merge the latest main into
    # the PR branch before final validation.
    update_method: merge

    # Keep in-place checks possible.
    # A value > 0 would force temporary batch PRs for retries.
    max_checks_retries: 0

    # Do not dequeue simply because CI takes longer than expected.
    checks_timeout: null

    # With batch_size: 1 there is normally nothing to batch together,
    # but keeping this value is harmless.
    batch_max_wait_time: 5 min

    # Final integration into main uses squash.
    merge_method: squash

    # Maintainer-controlled queue admission.
    #
    # Do NOT repeat ci / lint, ci / build, etc. here.
    # GitHub Rulesets define those requirements.
    queue_conditions:
      - label = queue-me
      - -draft

    # Keep these identical to queue_conditions so the queue stays
    # compatible with Mergify's in-place checking model.
    #
    # GitHub Ruleset requirements are injected automatically in addition
    # to these conditions.
    merge_conditions:
      - label = queue-me
      - -draft


pull_request_rules:
  # A PR is queued only after a maintainer explicitly adds `queue-me`.
  - name: queue explicitly approved pull requests
    conditions:
      - label = queue-me
      - -draft
    actions:
      queue:
        name: default

  # Security workflow changes require manual attention.
  - name: label security workflow changes
    conditions:
      - files ~= ^\.github/workflows/security
    actions:
      label:
        add:
          - security
          - manual-review

  # Automatically classify documentation changes.
  - name: label documentation changes
    conditions:
      - files ~= ^docs/
    actions:
      label:
        add:
          - documentation