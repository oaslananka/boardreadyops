# Merge Queue remains maintainer-controlled. A PR enters the queue only after a
# maintainer explicitly applies the `queue-me` label; automation must never add
# that label. Repository rulesets remain the authoritative merge gate.
merge_queue:
  mode: parallel
  max_parallel_checks: 1
  status_comments: outcomes
  reset_on_external_merge: always
  skip_intermediate_results: true

# File-pattern scopes are used only by Mergify to avoid running conflicting
# queued changes in parallel. BoardReadyOps CI continues to use its own
# risk-profile job for validation routing.
scopes:
  source:
    files:
      cli:
        include:
          - "src/cli/**/*"
      core:
        include:
          - "src/**/*"
          - "packages/cloud-core/**/*"
          - "packages/db/**/*"
      web:
        include:
          - "apps/web/**/*"
          - "packages/db/**/*"
      repository:
        include:
          - ".github/**/*"
          - "scripts/**/*"
          - "package.json"
          - "pnpm-lock.yaml"
          - "renovate.json"
  merge_queue_scope: merge-queue

queue_rules:
  - name: default
    batch_size: 1
    batch_max_wait_time: 5 min
    merge_method: squash
    queue_conditions:
      - label = queue-me
      - -draft
      - check-success = ci / risk-profile
      - check-success = ci / lint
      - check-success = ci / typecheck
      - check-success = ci / test-unit
      - check-success = ci / build
      - check-success = ci / verify-dist
      - check-success = security / gate

    merge_conditions:
      - label = queue-me
      - -draft
      - check-success = ci / risk-profile
      - check-success = ci / lint
      - check-success = ci / typecheck
      - check-success = ci / test-unit
      - check-success = ci / build
      - check-success = ci / verify-dist
      - check-success = security / gate

pull_request_rules:
  - name: queue explicitly approved pull requests
    conditions:
      - label = queue-me
      - -draft
    actions:
      queue:
        name: default

  - name: label security workflow changes
    conditions:
      - files ~= "^\\.github/workflows/security"
    actions:
      label:
        add: ["security", "manual-review"]

  - name: label documentation changes
    conditions:
      - files ~= "^docs/"
    actions:
      label:
        add: ["documentation"]
